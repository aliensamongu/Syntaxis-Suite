<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Σyntaxis Interpreter | True Offline</title>
    
    <script src="strongs-greek-dictionary.js"></script>
    
    <style>
        :root {
            --sidebar-width: 320px;
            --lexicon-width: 380px;
            --bg-main: #e4e7ea;
            
            /* Oxford Scholar Palette */
            --oxford-navy: #1B263B;
            --oxford-navy-dark: #121A2A;
            --oxford-cream: #F8F5EE;
            --oxford-gold: #C5A059;
            --oxford-crimson: #8C1C13;
            
            --radius-small: 8px;
            --radius-medium: 12px;
        }

        body {
            margin: 0; display: flex; height: 100vh;
            font-family: -apple-system, sans-serif;
            overflow: hidden; background: var(--bg-main);
        }
        
        #sidebar {
            width: var(--sidebar-width); background: var(--oxford-navy); flex-shrink: 0;
            border-right: 1px solid var(--oxford-navy-dark); display: flex; flex-direction: column;
            padding: 25px; box-sizing: border-box; color: var(--oxford-cream); gap: 20px;
        }
        
        h2 { margin: 0; font-family: Georgia, serif; font-size: 24px; color: var(--oxford-cream); }
        h3 { margin: 0; font-size: 11px; color: var(--oxford-gold); text-transform: uppercase; letter-spacing: 1px; font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px; }

        textarea {
            width: 100%; box-sizing: border-box; border-radius: var(--radius-small);
            border: 1px solid var(--oxford-navy-dark); padding: 10px;
            font-family: inherit; font-size: 13px; background: var(--oxford-cream);
            height: 100px; resize: vertical;
        }

        .std-btn {
            border: none; padding: 10px; border-radius: var(--radius-small);
            cursor: pointer; font-weight: bold; font-size: 11px; text-transform: uppercase;
            background: var(--oxford-gold); color: var(--oxford-navy-dark); width: 100%;
        }
        .std-btn:hover { filter: brightness(1.1); transform: translateY(-1px); }

        #workspace { flex-grow: 1; overflow-y: auto; padding: 40px; display: flex; justify-content: center; align-items: flex-start; }
        
        #text-canvas { 
            width: 100%; max-width: 700px; background: white; padding: 40px; 
            border-radius: var(--radius-medium); box-shadow: 0 5px 20px rgba(0,0,0,0.05); 
            font-family: Georgia, serif; font-size: 24px; color: var(--oxford-navy-dark); 
            line-height: 2.2; cursor: text; min-height: 50vh;
        }

        .word { display: inline-block; padding: 2px 4px; margin: 0 2px; border-radius: 4px; cursor: pointer; transition: 0.2s; }
        .word:hover { background-color: rgba(0,0,0,0.05); }
        .word.selected { background-color: var(--oxford-gold); color: var(--oxford-navy-dark); font-weight: bold; }

        #lexicon-panel {
            width: var(--lexicon-width); background: white; flex-shrink: 0;
            border-left: 1px solid #d1d5da; display: flex; flex-direction: column;
            box-shadow: -2px 0 15px rgba(0,0,0,0.05);
        }

        .lexicon-header { background: var(--oxford-navy-dark); color: var(--oxford-cream); padding: 20px; font-family: Georgia, serif; text-align: center; }
        .lexicon-header h2 { font-size: 20px; margin: 0 0 15px 0; }

        .strongs-search-container { display: flex; gap: 5px; }
        .strongs-input { flex-grow: 1; padding: 8px; border-radius: 4px; border: none; font-family: monospace; font-size: 14px; text-transform: uppercase; }
        .strongs-btn { background: var(--oxford-gold); color: var(--oxford-navy-dark); border: none; border-radius: 4px; padding: 0 15px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 11px; }
        .strongs-btn:hover { filter: brightness(1.1); }

        .api-content { padding: 25px; overflow-y: auto; flex-grow: 1; }
        .loader { font-size: 14px; color: #666; text-align: center; display: none; font-style: italic; }

        .api-word { font-family: Georgia, serif; font-size: 32px; color: var(--oxford-navy); margin: 0 0 5px 0; border-bottom: 2px solid var(--oxford-gold); padding-bottom: 5px; display: flex; justify-content: space-between; align-items: baseline; }
        .strongs-tag { font-family: -apple-system, sans-serif; font-size: 12px; font-weight: bold; color: var(--oxford-crimson); background: rgba(140, 28, 19, 0.1); padding: 3px 8px; border-radius: 12px; letter-spacing: 1px;}
        .api-phonetic { font-size: 14px; color: #666; margin-bottom: 20px; font-family: monospace; }
        .api-pos { font-size: 11px; text-transform: uppercase; font-weight: bold; color: var(--oxford-crimson); margin-top: 15px; letter-spacing: 1px; }
        .api-def { font-size: 15px; line-height: 1.5; color: #333; margin: 5px 0 15px 0; padding-left: 10px; border-left: 3px solid var(--bg-main); }
        .empty-state { text-align: center; color: #aaa; font-style: italic; margin-top: 50px; }

    </style>
</head>
<body>

<div id="sidebar">
    <h2>Σyntaxis <span style="font-weight: 300;">Interpreter</span></h2>
    
    <div style="display: flex; flex-direction: column; gap: 8px;">
        <h3>Passage Input</h3>
        <textarea id="rawTextInput" placeholder="Shared Brain text will appear here..."></textarea>
        <button class="std-btn" onclick="renderText()">Render Text</button>
    </div>
    
    <div style="margin-top: auto; font-size: 11px; color: rgba(255,255,255,0.5); text-align: center; line-height: 1.5;">
        Click an English word to fetch its standard definition, or use the Strong's search bar for Greek/Hebrew.
    </div>
</div>

<div id="workspace">
    <div id="text-canvas">
        <span style="color: #aaa; font-style: italic; font-size: 18px; pointer-events: none;">Waiting for text...</span>
    </div>
</div>

<div id="lexicon-panel">
    <div class="lexicon-header">
        <h2>Lexicon Database</h2>
        <div class="strongs-search-container">
            <input type="text" id="strongsInput" class="strongs-input" placeholder="e.g., Love, World, G2424" onkeypress="if(event.key === 'Enter') searchStrongs()">
            <button class="strongs-btn" onclick="searchStrongs()">Search</button>
        </div>
    </div>
    <div class="api-content" id="api-results">
        <div class="empty-state">Click a word in the text or enter a Strong's number above...</div>
        <div class="loader" id="api-loader">Fetching data...</div>
    </div>
</div>

<script>
    const canvas = document.getElementById('text-canvas');
    const apiResults = document.getElementById('api-results');
    const loader = document.getElementById('api-loader');
    let lastSelected = null;

    function renderText() {
        const raw = document.getElementById('rawTextInput').value.trim();
        if(!raw) return;
        canvas.innerHTML = '';
        const words = raw.split(/(\s+)/); 
        
        words.forEach((chunk, index) => {
            if (chunk.trim() === '') { 
                canvas.appendChild(document.createTextNode(chunk)); 
            } else {
                const span = document.createElement('span');
                span.className = 'word';
                span.id = `w-${index}`;
                span.innerText = chunk;
                
                span.onclick = () => {
                    if(lastSelected) lastSelected.classList.remove('selected');
                    span.classList.add('selected');
                    lastSelected = span;
                    const cleanWord = chunk.replace(/[.,;!?]/g, '');
                    fetchEnglishDefinition(cleanWord);
                };
                canvas.appendChild(span);
            }
        });
    }

    async function fetchEnglishDefinition(word) {
        apiResults.innerHTML = ''; apiResults.appendChild(loader); loader.style.display = 'block';
        try {
            const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word}`);
            if (!response.ok) throw new Error("Not found");
            const data = await response.json();
            const wordData = data[0];
            loader.style.display = 'none';
            
            let html = `<h3 class="api-word">${wordData.word} <span class="strongs-tag">ENG</span></h3>`;
            if (wordData.phonetic) html += `<div class="api-phonetic">${wordData.phonetic}</div>`;
            wordData.meanings.forEach(meaning => {
                html += `<div class="api-pos">${meaning.partOfSpeech}</div>`;
                meaning.definitions.slice(0, 2).forEach(def => { html += `<div class="api-def">${def.definition}</div>`; });
            });
            apiResults.innerHTML = html;
        } catch (error) {
            loader.style.display = 'none';
            apiResults.innerHTML = `<div class="empty-state" style="color: var(--oxford-crimson);">No general English definition found for "${word}". Try a Strong's number above.</div>`;
        }
    }

    // THE REVERSE SEARCH ENGINE
    function searchStrongs() {
        let query = document.getElementById('strongsInput').value.trim();
        if(!query) return;
        
        apiResults.innerHTML = ''; 
        
        // Failsafe: Ensure dictionary is loaded
        if (typeof strongsGreekDictionary === 'undefined') {
            apiResults.innerHTML = `<div class="empty-state" style="color: var(--oxford-crimson);">Database not loaded. Check file connection.</div>`;
            return;
        }

        let upperQuery = query.toUpperCase();

        // 1. Direct Strong's Number Search (e.g., "G2424" or just "2424")
        let strongKey = upperQuery.startsWith('G') ? upperQuery : 'G' + upperQuery;
        if (strongsGreekDictionary[strongKey] && !isNaN(upperQuery.replace('G', ''))) {
            renderGreekCard(strongKey);
            return;
        }

        // 2. English Keyword Reverse Search
        let results = [];
        let searchWord = query.toLowerCase();
        
        // Loop through the entire 5,000+ word dictionary instantly
        for (const [key, data] of Object.entries(strongsGreekDictionary)) {
            let kjv = (data.kjv_def || "").toLowerCase();
            let def = (data.strongs_def || "").toLowerCase();
            
            // Use regex to find whole words only (so "son" doesn't match "person")
            let regex = new RegExp(`\\b${searchWord}\\b`, 'i');
            
            if (regex.test(kjv) || regex.test(def)) {
                results.push({ key: key, data: data });
            }
        }

        // 3. Render Search Results
        if (results.length === 0) {
            apiResults.innerHTML = `<div class="empty-state" style="color: var(--oxford-crimson);">No Greek matches found for "${query}".</div>`;
            return;
        }

        // If exactly one match, go straight to the card
        if (results.length === 1) {
            renderGreekCard(results[0].key);
            return;
        }

        // If multiple matches, generate a clickable list
        let html = `<h3 style="font-size: 12px; color: #666; text-transform: uppercase; margin-bottom: 15px;">Found ${results.length} matches for "${query}"</h3>`;
        results.forEach(res => {
            let preview = res.data.kjv_def ? res.data.kjv_def.substring(0, 50) + '...' : 'Click to view details';
            html += `
            <div style="background: var(--oxford-cream); border: 1px solid var(--oxford-navy-dark); padding: 12px; margin-bottom: 8px; border-radius: 4px; cursor: pointer; transition: 0.2s;" onmouseover="this.style.borderColor='var(--oxford-gold)'" onmouseout="this.style.borderColor='var(--oxford-navy-dark)'" onclick="renderGreekCard('${res.key}')">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
                    <strong style="font-family: Georgia, serif; font-size: 18px; color: var(--oxford-navy);">${res.data.lemma}</strong>
                    <span class="strongs-tag">${res.key}</span>
                </div>
                <div style="font-size: 12px; color: var(--oxford-crimson); font-weight: bold; margin-bottom: 3px;">${res.data.translit || ''}</div>
                <div style="font-size: 11px; color: #555;">${preview}</div>
            </div>`;
        });
        
        apiResults.innerHTML = html;
    }

    // THE LEXICON CARD RENDERER
    function renderGreekCard(key) {
        const data = strongsGreekDictionary[key];
        const defText = data.strongs_def || "Definition not provided in database.";
        const derivationText = data.derivation ? `<div style="font-size: 12px; color: #666; margin-bottom: 10px;"><em>Derivation:</em> ${data.derivation}</div>` : "";
        const kjvText = data.kjv_def ? `<div class="api-pos">KJV TRANSLATION(S)</div><div class="api-def" style="border-left: 3px solid var(--oxford-gold);">${data.kjv_def}</div>` : "";

        apiResults.innerHTML = `
            <button onclick="searchStrongs()" style="background: none; border: none; color: #aaa; cursor: pointer; font-size: 11px; text-transform: uppercase; margin-bottom: 15px; font-weight: bold; padding: 0;">← Back to Results</button>
            <h3 class="api-word">${data.lemma} <span class="strongs-tag">${key}</span></h3>
            <div class="api-phonetic">${data.translit || ''}</div>
            ${derivationText}
            <div class="api-pos">STRONG'S DEFINITION</div>
            <div class="api-def">${defText}</div>
            ${kjvText}
        `;
    }

    window.addEventListener('DOMContentLoaded', () => {
        const sharedText = sessionStorage.getItem('syntaxis_shared_brain');
        const myInput = document.getElementById('rawTextInput');
        if(sharedText && myInput) {
            myInput.value = sharedText;
            renderText(); 
        }
    });

</script>
</body>
</html>
