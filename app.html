<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Σyntaxis Diagrammer</title>
    <style>
        :root { --sidebar-width: 380px; --right-sidebar-width: 320px; --bg-main: #e4e7ea; --oxford-navy: #1B263B; --oxford-navy-dark: #121A2A; --oxford-cream: #F8F5EE; --oxford-gold: #C5A059; --oxford-crimson: #8C1C13; --rustic-orange: #C86428; --radius-small: 8px; --radius-medium: 12px; }
        body { margin: 0; display: flex; height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow: hidden; background: var(--bg-main); }
        #sidebar { width: var(--sidebar-width); background: var(--oxford-navy); flex-shrink: 0; border-right: 1px solid var(--oxford-navy-dark); display: flex; flex-direction: column; z-index: 100; box-shadow: 2px 0 15px rgba(0,0,0,0.15); }
        .sidebar-inner { padding: 25px; display: flex; flex-direction: column; flex-grow: 1; overflow-y: auto; }
        #right-sidebar { width: var(--right-sidebar-width); background: var(--oxford-navy); flex-shrink: 0; border-left: 1px solid var(--oxford-navy-dark); display: flex; flex-direction: column; }
        .right-inner { padding: 25px; display: flex; flex-direction: column; flex-grow: 1; overflow-y: hidden; }
        h2 { margin: 0; color: var(--oxford-cream); font-family: Georgia, serif; font-size: 24px; }
        h3 { margin: 0 0 10px 0; font-size: 13px; color: var(--oxford-gold); text-transform: uppercase; letter-spacing: 1px; font-weight: bold; }
        input[type="text"], textarea, select { width: 100%; box-sizing: border-box; border-radius: var(--radius-small); border: 1px solid var(--oxford-navy-dark); padding: 10px; font-family: inherit; font-size: 13px; color: var(--oxford-navy); background: var(--oxford-cream); outline: none; }
        #word-bank { height: 250px; flex-shrink: 0; margin-top: 15px; overflow-y: auto; padding: 15px; display: flex; flex-wrap: wrap; gap: 6px 10px; background: var(--oxford-navy-dark); border-radius: var(--radius-medium); }
        .bank-word { font-family: Georgia, serif; font-size: 19px; color: var(--oxford-cream); cursor: grab; padding: 4px 8px; user-select: none; }
        .std-btn { border: none; padding: 10px; border-radius: var(--radius-small); cursor: pointer; font-weight: bold; font-size: 11px; text-transform: uppercase; transition: 0.1s; background: var(--oxford-gold); color: var(--oxford-navy); }
        #canvas-viewport { flex-grow: 1; overflow: auto; position: relative; background: var(--bg-main); }
        canvas { background: #fff; display: block; cursor: crosshair; }
        .app-nav { display: flex; gap: 5px; margin-bottom: 20px; margin-top: 10px; }
        .app-nav a { flex: 1; text-align: center; padding: 8px 4px; font-size: 9px; color: #F8F5EE; text-decoration: none; text-transform: uppercase; font-weight: bold; background: #121A2A; border: 1px solid rgba(255,255,255,0.05); border-radius: 4px; }
        .app-nav a.active { background: #C5A059; color: #121A2A; }
    </style>
</head>
<body>
<div id="sidebar">
    <div class="sidebar-inner">
        <h2>Σyntaxis<span style="color:var(--oxford-gold);">IX</span></h2>
        <div class="app-nav"><a href="annotator.html">Annotate</a><a href="app.html" class="active">Diagram</a><a href="interpreter.html">Interpret</a><a href="outliner.html">Outline</a></div>
        <input type="text" id="projectName" placeholder="Diagram Name"><input type="text" id="verseReference" placeholder="Ref (e.g. 1Pet 3:18)">
        <button class="std-btn" onclick="saveToApp()" style="width:100%; margin-top:5px;">Save App</button>
        <div class="palette" style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:5px; margin-top:10px;">
            <div style="background:white; border:1px solid #333; padding:10px; cursor:pointer;" onclick="addShape('subject_baseline')">Subj</div>
        </div>
    </div>
</div>
<div id="canvas-viewport"><canvas id="mainCanvas"></canvas></div>
<div id="right-sidebar">
    <div class="right-inner">
        <h3>Text Source</h3>
        <input type="text" id="dbRefInput" placeholder="Matt 1:1-5">
        <select id="dbModuleSelect">
            <optgroup label="Original"><option value="tischendorf.xml">Tischendorf Greek</option><option value="srgnt.tsv">SRGNT (Bunning)</option><option value="hebrew_ot.xml">Hebrew OT</option></optgroup>
            <optgroup label="English"><option value="kjv_strongs.xml">KJV</option><option value="emtv.xml">EMTV</option><option value="esv.xml">ESV</option></optgroup>
        </select>
        <button class="std-btn" onclick="loadNativeBibleTextOnly(document.getElementById('dbRefInput').value, document.getElementById('dbModuleSelect').value)" style="width:100%; margin-top:5px;">Extract Text</button>
        <textarea id="passageInput" placeholder="Or paste here..." oninput="updateWordBank()"></textarea>
        <div id="word-bank"></div>
    </div>
</div>
<script>
    const canvas = document.getElementById('mainCanvas'); const ctx = canvas.getContext('2d'); const bank = document.getElementById('word-bank');
    let elements = [], zoomLevel = 1; canvas.width = 4000; canvas.height = 4000;
    const abbrevs = { "gen": "genesis", "exo": "exodus", "lev": "leviticus", "num": "numbers", "deu": "deuteronomy", "jos": "joshua", "jud": "judges", "rut": "ruth", "1 sa": "1 samuel", "2 sa": "2 samuel", "1 ki": "1 kings", "2 ki": "2 kings", "1 ch": "1 chronicles", "2 ch": "2 chronicles", "ezr": "ezra", "neh": "nehemiah", "est": "esther", "job": "job", "psa": "psalms", "pro": "proverbs", "ecc": "ecclesiastes", "sng": "song of solomon", "isa": "isaiah", "jer": "jeremiah", "lam": "lamentations", "eze": "ezekiel", "dan": "daniel", "hos": "hosea", "joe": "joel", "amo": "amos", "oba": "obadiah", "jon": "jonah", "mic": "micah", "nah": "nahum", "hab": "habakkuk", "zep": "zephaniah", "hag": "haggai", "zec": "zechariah", "mal": "malachi", "mat": "matthew", "mrk": "mark", "mk": "mark", "luk": "luke", "lk": "luke", "jhn": "john", "jn": "john", "act": "acts", "rom": "romans", "1 cor": "1 corinthians", "2 cor": "2 corinthians", "gal": "galatians", "eph": "ephesians", "php": "philippians", "col": "colossians", "1 th": "1 thessalonians", "2 th": "2 thessalonians", "1 ti": "1 timothy", "2 ti": "2 timothy", "tit": "titus", "phm": "philemon", "heb": "hebrews", "jas": "james", "rev": "revelation" };
    const bnumberMap = { "genesis": 1, "exodus": 2, "leviticus": 3, "numbers": 4, "deuteronomy": 5, "joshua": 6, "judges": 7, "ruth": 8, "1 samuel": 9, "2 samuel": 10, "1 kings": 11, "2 kings": 12, "1 chronicles": 13, "2 chronicles": 14, "ezra": 15, "nehemiah": 16, "esther": 17, "job": 18, "psalms": 19, "proverbs": 20, "ecclesiastes": 21, "song of solomon": 22, "isaiah": 23, "jeremiah": 24, "lamentations": 25, "ezekiel": 26, "daniel": 27, "hosea": 28, "joel": 29, "amos": 30, "obadiah": 31, "jonah": 32, "micah": 33, "nahum": 34, "habakkuk": 35, "zephaniah": 36, "haggai": 37, "zechariah": 38, "malachi": 39, "matthew": 40, "mark": 41, "luke": 42, "john": 43, "acts": 44, "romans": 45, "1 corinthians": 46, "2 corinthians": 47, "galatians": 48, "ephesians": 49, "philippians": 50, "colossians": 51, "1 thessalonians": 52, "2 thessalonians": 53, "1 timothy": 54, "2 timothy": 55, "titus": 56, "philemon": 57, "hebrews": 58, "james": 59, "1 peter": 60, "2 peter": 61, "1 john": 62, "2 john": 63, "3 john": 64, "jude": 65, "revelation": 66 };
    async function loadNativeBibleTextOnly(q, f) {
        let m = q.replace(/^(\d)\s*([a-zA-Z]+)/, "$1 $2").match(/^([\d\s]*[a-zA-Z\s]+?)\s+(\d+)(?:\s*:\s*(\d+)(?:\s*-\s*(\d+))?)?\s*$/);
        if (!m) return;
        const bN = abbrevs[m[1].trim().toLowerCase()] || m[1].trim().toLowerCase();
        let sV = m[3] ? parseInt(m[3]) : null, eV = m[4] ? parseInt(m[4]) : sV;
        if (f === 'srgnt.tsv') {
            const res = await fetch('srgnt.tsv'); const t = await res.text(); const bNum = bnumberMap[bN]; const pre = bNum.toString().padStart(2, '0') + m[2].toString().padStart(3, '0');
            let txt = ""; t.split('\n').forEach(l => { if (l.startsWith(pre)) { const c = l.split('\t'), vn = parseInt(c[0].substring(5, 8).replace(/^0+/, ''), 10); if (!sV || (vn >= sV && vn <= eV)) txt += c[1] + " "; } });
            document.getElementById('passageInput').value = txt.trim(); updateWordBank(); return;
        }
        const res = await fetch(f); const xd = new DOMParser().parseFromString(await res.text(), "text/xml"); let txt = "";
        xd.querySelectorAll('VERS, verse').forEach(v => { let vn = parseInt(v.getAttribute('vnumber')||v.getAttribute('number')); if (!sV || (vn >= sV && vn <= eV)) txt += v.textContent + " "; });
        document.getElementById('passageInput').value = txt.trim(); updateWordBank();
    }
    function updateWordBank() { const words = document.getElementById('passageInput').value.split(/\s+/).filter(w => w.length > 0); bank.innerHTML = ''; words.forEach(w => { const s = document.createElement('span'); s.className = 'bank-word'; s.innerText = w; s.draggable = true; s.ondragstart = (e) => e.dataTransfer.setData("text", w); bank.appendChild(s); }); }
    function addShape(type, x=500, y=500, val="Word") { elements.push({ type, x, y, val }); draw(); }
    canvas.ondragover = e => e.preventDefault(); canvas.ondrop = e => { e.preventDefault(); const r = canvas.getBoundingClientRect(); addShape('text', (e.clientX-r.left)/zoomLevel, (e.clientY-r.top)/zoomLevel, e.dataTransfer.getData("text")); };
    function draw() { ctx.clearRect(0,0,canvas.width,canvas.height); elements.forEach(el => { ctx.beginPath(); if(el.type==='text'){ ctx.font="italic 20px Georgia"; ctx.fillText(el.val, el.x, el.y); } ctx.stroke(); }); }
</script>
</body>
</html>
