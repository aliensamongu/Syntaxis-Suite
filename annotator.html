        input:checked + .slider { background-color: var(--oxford-gold); }
        input:checked + .slider:before { transform: translateX(16px); }

<body>
<div id="sidebar">
    <div class="sidebar-inner">
        <h2>Σyntaxis <span style="font-weight: 300;">Markup</span></h2>
        <div class="app-nav"><a href="annotator.html" class="active">Annotate</a><a href="app.html">Diagram</a><a href="interpreter.html">Interpret</a><a href="outliner.html">Outline</a></div>
        <div style="display: flex; flex-direction: column; gap: 8px;"><input type="text" id="projectName" placeholder="Project Name"><div class="btn-group"><button class="std-btn" onclick="saveLocalApp()">Save</button><button class="std-btn secondary" onclick="downloadJSON()">JSON</button><button class="std-btn secondary" onclick="document.getElementById('fileInput').click()">Load</button><input type="file" id="fileInput" style="display: none;" onchange="loadJSON(event)"></div><div id="saved-list"></div></div>
        <div style="display: flex; flex-direction: column; gap: 8px;"><h3>1. Load Text</h3>
            <div style="display: flex; flex-direction: column; gap: 5px;"><input type="text" id="bibleRefInput" placeholder="Matt 1:1-5"><div style="display: flex; gap: 5px;"><select id="bibleModuleSelect" style="flex: 2;"><optgroup label="Interlinear"><option value="nt_interlinear">NT Interlinear</option><option value="ot_interlinear">OT Interlinear</option></optgroup><optgroup label="Original"><option value="tischendorf.xml">Tischendorf Greek</option><option value="srgnt.tsv">SRGNT (Bunning)</option><option value="hebrew_ot.xml">Hebrew OT</option></optgroup><optgroup label="English"><option value="kjv_strongs.xml">KJV</option><option value="emtv.xml">EMTV</option><option value="esv.xml">ESV</option></optgroup></select><button class="std-btn" onclick="loadNativeBible(document.getElementById('bibleRefInput').value, document.getElementById('bibleModuleSelect').value)" style="flex: 1;">Load</button></div></div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px;"><h3>2. Palette</h3><div style="display: flex; gap: 10px;"><input type="color" id="color-picker" value="#C5A059" oninput="activeColor = this.value"></div><button class="std-btn secondary" onclick="addLabel()">+ Add Label</button><div id="label-container"></div></div>
        <div style="margin-top: auto;"><button class="std-btn" style="background: #27ae60; color: white;" onclick="exportSnapshot()">📸 Snapshot</button></div>
    </div>
</div>
<div id="workspace">
    <div class="header-controls">
        <div class="toggle-wrapper" id="original-toggle-container" style="display: none;"><span class="toggle-label" id="orig-toggle-label">Show Original</span><label class="switch"><input type="checkbox" id="originalToggle" checked onchange="toggleOriginalText()"><span class="slider"></span></label></div>
        <div class="font-sizer"><span>Size</span><input type="range" min="16" max="48" value="22" oninput="document.getElementById('text-canvas').style.fontSize = this.value + 'px';"></div>
    </div>
    <div id="editor-container"><div id="text-canvas"></div><div id="gutter"></div></div>
    <svg id="svg-layer"><defs id="svg-defs"></defs><g id="arrow-paths"></g></svg>
</div>
<div id="context-menu"><div class="menu-item" onclick="applyMarkup('highlight')">✨ Highlight</div><div class="menu-item" onclick="applyMarkup('underline')"><u>U</u> Underline</div><div class="menu-item" onclick="applyArrow()">➔ Arrow</div><div class="menu-item" onclick="promptGrammarTag()">🏷 Tag</div><div class="menu-item" onclick="addMarginNote()">📝 Note</div></div>
<script>
    const canvas = document.getElementById('text-canvas'); const gutter = document.getElementById('gutter'); const svgPaths = document.getElementById('arrow-paths');
    const menu = document.getElementById('context-menu'); const colorPicker = document.getElementById('color-picker'); 
    const originalToggleContainer = document.getElementById('original-toggle-container'); const originalToggleLabel = document.getElementById('orig-toggle-label');
    const originalToggle = document.getElementById('originalToggle');
    let selectedWords = [], connections = [], notes = [], activeColor = "#C5A059", currentBook = "", currentChapter = "";
    const abbrevs = { "gen": "genesis", "exo": "exodus", "lev": "leviticus", "num": "numbers", "deu": "deuteronomy", "jos": "joshua", "jud": "judges", "rut": "ruth", "1 sa": "1 samuel", "2 sa": "2 samuel", "1 ki": "1 kings", "2 ki": "2 kings", "1 ch": "1 chronicles", "2 ch": "2 chronicles", "ezr": "ezra", "neh": "nehemiah", "est": "esther", "job": "job", "psa": "psalms", "pro": "proverbs", "ecc": "ecclesiastes", "sng": "song of solomon", "isa": "isaiah", "jer": "jeremiah", "lam": "lamentations", "eze": "ezekiel", "dan": "daniel", "hos": "hosea", "joe": "joel", "amo": "amos", "oba": "obadiah", "jon": "jonah", "mic": "micah", "nah": "nahum", "hab": "habakkuk", "zep": "zephaniah", "hag": "haggai", "zec": "zechariah", "mal": "malachi", "mat": "matthew", "mrk": "mark", "mk": "mark", "luk": "luke", "lk": "luke", "jhn": "john", "jn": "john", "act": "acts", "rom": "romans", "1 cor": "1 corinthians", "2 cor": "2 corinthians", "gal": "galatians", "eph": "ephesians", "php": "philippians", "col": "colossians", "1 th": "1 thessalonians", "2 th": "2 thessalonians", "1 ti": "1 timothy", "2 ti": "2 timothy", "tit": "titus", "phm": "philemon", "heb": "hebrews", "jas": "james", "1 pe": "1 peter", "2 pe": "2 peter", "1 jn": "1 john", "2 jn": "2 john", "3 jn": "3 john", "jude": "jude", "rev": "revelation" };
    const bnumberMap = { "genesis": 1, "exodus": 2, "leviticus": 3, "numbers": 4, "deuteronomy": 5, "joshua": 6, "judges": 7, "ruth": 8, "1 samuel": 9, "2 samuel": 10, "1 kings": 11, "2 kings": 12, "1 chronicles": 13, "2 chronicles": 14, "ezra": 15, "nehemiah": 16, "esther": 17, "job": 18, "psalms": 19, "proverbs": 20, "ecclesiastes": 21, "song of solomon": 22, "isaiah": 23, "jeremiah": 24, "lamentations": 25, "ezekiel": 26, "daniel": 27, "hosea": 28, "joel": 29, "amos": 30, "obadiah": 31, "jonah": 32, "micah": 33, "nahum": 34, "habakkuk": 35, "zephaniah": 36, "haggai": 37, "zechariah": 38, "malachi": 39, "matthew": 40, "mark": 41, "luke": 42, "john": 43, "acts": 44, "romans": 45, "1 corinthians": 46, "2 corinthians": 47, "galatians": 48, "ephesians": 49, "philippians": 50, "colossians": 51, "1 thessalonians": 52, "2 thessalonians": 53, "1 timothy": 54, "2 timothy": 55, "titus": 56, "philemon": 57, "hebrews": 58, "james": 59, "1 peter": 60, "2 peter": 61, "1 john": 62, "2 john": 63, "3 john": 64, "jude": 65, "revelation": 66 };
    const osisMap = { "genesis": "Gen", "exodus": "Exod", "leviticus": "Lev", "numbers": "Num", "deuteronomy": "Deut", "joshua": "Josh", "judges": "Judg", "ruth": "Ruth", "1 samuel": "1Sam", "2 samuel": "2Sam", "1 kings": "1Kgs", "2 kings": "2Kgs", "1 chronicles": "1Chr", "2 chronicles": "2Chr", "ezra": "Ezra", "nehemiah": "Neh", "esther": "Esth", "job": "Job", "psalms": "Ps", "proverbs": "Prov", "ecclesiastes": "Eccl", "song of solomon": "Song", "isaiah": "Isa", "jeremiah": "Jer", "lamentations": "Lam", "ezekiel": "Ezek", "daniel": "Dan", "hosea": "Hos", "joel": "Joel", "amos": "Amos", "obadiah": "Obad", "jonah": "Jonah", "micah": "Mic", "nahum": "Nah", "habakkuk": "Hab", "zephaniah": "Zeph", "haggai": "Hag", "zechariah": "Zech", "malachi": "Mal", "matthew": "Matt", "mark": "Mark", "luke": "Luke", "john": "John", "acts": "Acts", "romans": "Rom", "1 corinthians": "1Cor", "2 corinthians": "2Cor", "galatians": "Gal", "ephesians": "Eph", "philippians": "Phil", "colossians": "Col", "1 thessalonians": "1Thess", "2 thessalonians": "2Thess", "1 timothy": "1Tim", "2 timothy": "2Tim", "titus": "Titus", "philemon": "Phlm", "hebrews": "Heb", "james": "Jas", "1 peter": "1Pet", "2 peter": "2Pet", "1 john": "1John", "2 john": "2John", "3 john": "3John", "jude": "Jude", "revelation": "Rev" };
    function toggleOriginalText() { const c = originalToggle.checked; document.querySelectorAll('.original-line').forEach(l => l.style.display = c ? 'block' : 'none'); }
    async function loadNativeBible(q, f) {
        canvas.innerHTML = "Loading..."; let m = q.replace(/^(\d)\s*([a-zA-Z]+)/, "$1 $2").match(/^([\d\s]*[a-zA-Z\s]+?)\s+(\d+)(?:\s*:\s*(\d+)(?:\s*-\s*(\d+))?)?\s*$/);
        if (!m) { canvas.innerHTML = "Invalid Ref."; return; }
        currentBook = abbrevs[m[1].trim().toLowerCase()] || m[1].trim().toLowerCase(); currentChapter = m[2];
        let sV = m[3] ? parseInt(m[3]) : null, eV = m[4] ? parseInt(m[4]) : sV;
        if (f === 'srgnt.tsv') { await renderSRGNT(sV, eV); return; }
        try {
            if (f.includes('interlinear')) { originalToggleContainer.style.display = 'flex'; const isH = f.includes('ot'); if(originalToggleLabel) originalToggleLabel.innerText = isH ? "HEBREW" : "GREEK"; const bN = bnumberMap[currentBook], os = osisMap[currentBook]; const [r1, r2] = await Promise.all([fetch(isH?'hebrew_ot.xml':'tischendorf.xml'), fetch(isH?'esv.xml':'emtv.xml')]); const d1 = new DOMParser().parseFromString(await r1.text(),"text/xml"), d2 = new DOMParser().parseFromString(await r2.text(),"text/xml");
                let html = ""; const v1 = d1.querySelectorAll(`BIBLEBOOK[bnumber="${bN}"] CHAPTER[cnumber="${currentChapter}"] VERS`); const v2 = isH ? d2.querySelectorAll(`book[number="${bN}"] chapter[number="${currentChapter}"] verse`) : d2.querySelectorAll(`chapter[osisID="${os}.${currentChapter}"] verse`);
                for (let i=0; i<v1.length; i++) { let vn = i+1; if (sV && (vn < sV || vn > eV)) continue; html += `<div class="verse-block"><span class="verse-num">${vn}</span><div class="original-line">`; v1[i].childNodes.forEach(n => { if (n.nodeType === 3) n.textContent.split(/\s+/).forEach(w => { if (w) html += `<span class="word">${w} </span>`; }); }); html += `</div><div class="english-line">${v2[i]?v2[i].textContent:""}</div></div>`; }
                canvas.innerHTML = html; return;
            }
            const res = await fetch(f); const xd = new DOMParser().parseFromString(await res.text(),"text/xml"); let html = ""; xd.querySelectorAll('VERS, verse').forEach(v => { let vn = parseInt(v.getAttribute('vnumber')||v.getAttribute('number')); if(sV && (vn < sV || vn > eV)) return; html += `<span class="verse-num">${vn}</span> ` + v.textContent + " "; }); canvas.innerHTML = html;
        } catch(e) { canvas.innerHTML = e.message; }
    }
    async function renderSRGNT(sV, eV) {
        try { const res = await fetch('srgnt.tsv'); const t = await res.text(); const bNum = bnumberMap[currentBook]; const pre = bNum.toString().padStart(2, '0') + currentChapter.toString().padStart(3, '0');
            let html = "", curV = "", lines = t.split('\n'); lines.forEach(l => { if (l.startsWith(pre)) { const c = l.split('\t'), vn = parseInt(c[0].substring(5, 8).replace(/^0+/, ''), 10); if (sV && (vn < sV || vn > eV)) return; if (vn.toString() !== curV) { curV = vn.toString(); html += `<div class="verse-block"><span class="verse-num">${vn}</span> `; } html += `<span class="word">${c[1]} </span>`; } });
            canvas.innerHTML = html; } catch(e) { canvas.innerHTML = e.message; }
    }
</script>
</body>
