<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Σyntaxis Diagrammer | Tri-Engine</title>
    <style>
        :root {
            --sidebar-width: 380px;
            --right-sidebar-width: 320px;
            --bg-main: #e4e7ea;
            --oxford-navy: #1B263B;
            --oxford-navy-dark: #121A2A;
            --oxford-cream: #F8F5EE;
            --oxford-gold: #C5A059;
            --oxford-crimson: #8C1C13;
            --radius-small: 8px;
            --radius-medium: 12px;
        }

        body {
            margin: 0; display: flex; height: 100vh;
            font-family: -apple-system, sans-serif;
            overflow: hidden; background: var(--bg-main);
        }
        
        #sidebar {
            width: var(--sidebar-width); background: var(--oxford-navy); flex-shrink: 0;
            border-right: 1px solid var(--oxford-navy-dark); display: flex; flex-direction: column;
            z-index: 100; box-shadow: 2px 0 15px rgba(0,0,0,0.15);
        }
        .sidebar-inner { padding: 25px; display: flex; flex-direction: column; flex-grow: 1; overflow-y: auto; }
        
        #right-sidebar {
            width: var(--right-sidebar-width); background: var(--oxford-navy); flex-shrink: 0;
            border-left: 1px solid var(--oxford-navy-dark); display: flex; flex-direction: column;
            z-index: 90; box-shadow: -2px 0 15px rgba(0,0,0,0.15);
        }
        .right-inner { padding: 25px; display: flex; flex-direction: column; flex-grow: 1; }

        h2 { margin: 0; color: var(--oxford-cream); font-family: Georgia, serif; font-size: 24px; }
        .ix { font-size: 14px; text-decoration: overline; margin-left: 4px; font-weight: bold; color: var(--oxford-gold); }
        h3 { margin: 0 0 10px 0; font-size: 13px; color: var(--oxford-gold); text-transform: uppercase; letter-spacing: 1px; font-weight: bold; }

        /* VIEW SWITCHER TABS */
        #view-switcher {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            display: flex; background: var(--oxford-navy-dark); padding: 5px;
            border-radius: 30px; z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .view-tab {
            padding: 8px 20px; color: #fff; font-size: 11px; font-weight: bold;
            text-transform: uppercase; cursor: pointer; border-radius: 20px; transition: 0.2s;
        }
        .view-tab.active { background: var(--oxford-gold); color: var(--oxford-navy-dark); }

        input[type="text"], textarea, select {
            width: 100%; box-sizing: border-box; border-radius: var(--radius-small);
            border: 1px solid var(--oxford-navy-dark); padding: 10px;
            font-family: inherit; font-size: 13px; color: var(--oxford-navy);
            background: var(--oxford-cream); outline: none;
        }
        
        #word-bank {
            height: 250px; flex-shrink: 0; margin-top: 15px; overflow-y: auto; padding: 15px;
            display: flex; flex-wrap: wrap; align-content: flex-start; gap: 6px 10px;
            background: var(--oxford-navy-dark); border-radius: var(--radius-medium);
        }
        
        .bank-word {
            font-family: Georgia, serif; font-size: 19px; color: var(--oxford-cream);
            cursor: grab; padding: 4px 8px; user-select: none; border-radius: var(--radius-small);
        }
        
        .palette { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 20px; }
        .tool {
            padding: 10px; border: 1px solid var(--oxford-navy-dark); border-radius: var(--radius-medium);
            text-align: center; background: var(--oxford-cream); cursor: pointer;
            color: var(--oxford-navy); font-size: 10px; font-weight: bold;
        }
        .tool svg { width: 24px; height: 24px; stroke: var(--oxford-navy); fill: none; stroke-width: 3.5; display: block; margin: 0 auto 6px; }

        /* VIEWPORT CONTAINERS */
        #canvas-viewport { flex-grow: 1; overflow: auto; position: relative; background: #fff; }
        #mainCanvas { background: #fff; display: block; cursor: crosshair; }
        
        #block-view, #dependency-view {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #fff; padding: 100px; box-sizing: border-box; overflow: auto;
        }
        
        /* BLOCK VIEW STYLING */
        .block-line { font-family: Georgia, serif; font-size: 24px; line-height: 2; color: var(--oxford-navy-dark); }
        .block-indent { border-left: 2px solid var(--oxford-gold); padding-left: 30px; margin-left: 20px; margin-top: 10px; }

        /* DEPENDENCY VIEW STYLING */
        .dep-word { position: absolute; font-family: Georgia, serif; font-size: 22px; cursor: pointer; }
        .dep-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

        .app-nav { display: flex; gap: 5px; margin-bottom: 20px; }
        .app-nav a { flex: 1; text-align: center; padding: 8px 4px; font-size: 9px; color: #F8F5EE; text-decoration: none; text-transform: uppercase; font-weight: bold; background: #121A2A; border-radius: 4px; }
        .app-nav a.active { background: var(--oxford-gold); color: var(--oxford-navy-dark); }
    </style>
</head>
<body>

<div id="view-switcher">
    <div class="view-tab active" onclick="switchView('manual')">Syntactic</div>
    <div class="view-tab" onclick="switchView('dependency')">Dependency</div>
    <div class="view-tab" onclick="switchView('block')">Block</div>
</div>

<div id="sidebar">
    <div class="sidebar-inner">
        <h2>Σyntaxis<span class="ix">IX</span></h2>
        <div class="app-nav">
            <a href="annotator.html">Annotate</a>
            <a href="app.html" class="active">Diagram</a>
            <a href="interpreter.html">Interpret</a>
            <a href="outliner.html">Outline</a>
        </div>
        
        <div class="palette">
            <div class="tool" onclick="addShape('subject_baseline')"><svg viewBox="0 0 100 100"><line x1="10" y1="50" x2="90" y2="50"/><line x1="50" y1="35" x2="50" y2="65"/></svg>Subject</div>
            <div class="tool" onclick="addShape('modifier')"><svg viewBox="0 0 100 100"><polyline points="30,20 50,70 95,70"/></svg>Modifier</div>
            <div class="tool" onclick="addShape('text')"><strong>Label</strong></div>
            
            <div class="tool" id="linkTool" onclick="toggleLinkMode()" style="background: var(--oxford-navy-dark); color: white; grid-column: span 3; border-color: var(--oxford-gold);">
                🔗 Link Relationship (L)
            </div>

            <button class="std-btn" onclick="elements=[]; draw();" style="background:var(--oxford-crimson); color:white; grid-column: span 3; margin-top:5px; border:none; padding:10px; border-radius:8px; font-weight:bold; cursor:pointer;">Clear Canvas</button>
        </div>
    </div>
</div>

<div id="canvas-viewport">
    <canvas id="mainCanvas"></canvas>
    
    <div id="block-view"></div>
    <div id="dependency-view">
        <svg class="dep-svg" id="depSvg"></svg>
        <div id="dep-word-layer"></div>
    </div>
</div>

<div id="right-sidebar">
    <div class="right-inner">
        <h3>Text Source</h3>
        <textarea id="passageInput" placeholder="Paste passage here..." oninput="updateWordBank()"></textarea>
        <div id="word-bank"></div>
    </div>
</div>

<script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    let elements = [], selectedElements = [];
    let currentView = 'manual';
    let isLinkMode = false;
    let linkSource = null;
    let zoomLevel = 1;

    canvas.width = 3000; canvas.height = 2000;

    // --- VIEW SWITCHER ---
    function switchView(mode) {
        currentView = mode;
        document.querySelectorAll('.view-tab').forEach(t => t.classList.remove('active'));
        event.target.classList.add('active');

        document.getElementById('mainCanvas').style.display = (mode === 'manual') ? 'block' : 'none';
        document.getElementById('block-view').style.display = (mode === 'block') ? 'block' : 'none';
        document.getElementById('dependency-view').style.display = (mode === 'dependency') ? 'block' : 'none';

        if (mode === 'block') renderBlockView();
        if (mode === 'dependency') renderDependencyView();
    }

    // --- RELATIONSHIP LINKING ---
    function toggleLinkMode() {
        isLinkMode = !isLinkMode;
        linkSource = null;
        document.getElementById('linkTool').style.background = isLinkMode ? "var(--oxford-gold)" : "var(--oxford-navy-dark)";
        document.getElementById('linkTool').style.color = isLinkMode ? "var(--oxford-navy-dark)" : "white";
    }

    // --- ENGINE: BLOCK VIEW (EXEGETICAL) ---
    function renderBlockView() {
        const container = document.getElementById('block-view');
        container.innerHTML = '<h3>Block Analysis</h3>';
        
        const textElements = elements.filter(el => el.type === 'text');
        // Find roots (words with no parent)
        const roots = textElements.filter(el => !el.parentId);

        const buildBlock = (el, level) => {
            const div = document.createElement('div');
            div.className = level > 0 ? "block-indent" : "block-line";
            div.innerHTML = `<strong>${el.val}</strong>`;
            
            const children = textElements.filter(child => child.parentId === el.id);
            children.forEach(child => div.appendChild(buildBlock(child, level + 1)));
            return div;
        };

        roots.forEach(root => container.appendChild(buildBlock(root, 0)));
    }

    // --- ENGINE: DEPENDENCY TREE ---
    function renderDependencyView() {
        const wordLayer = document.getElementById('dep-word-layer');
        const svg = document.getElementById('depSvg');
        wordLayer.innerHTML = '';
        svg.innerHTML = '';

        const textElements = elements.filter(el => el.type === 'text');
        let currentX = 100;

        // Position words linearly
        textElements.forEach(el => {
            const div = document.createElement('div');
            div.className = 'dep-word';
            div.innerText = el.val;
            div.style.left = currentX + 'px';
            div.style.top = '400px';
            el.depX = currentX + (div.innerText.length * 5); // Store center point
            wordLayer.appendChild(div);
            currentX += div.offsetWidth + 80;
        });

        // Draw Arcs
        textElements.forEach(el => {
            if (el.parentId) {
                const parent = textElements.find(p => p.id === el.parentId);
                if (parent) {
                    const x1 = el.depX;
                    const x2 = parent.depX;
                    const midX = (x1 + x2) / 2;
                    const height = Math.abs(x1 - x2) * 0.4;
                    
                    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                    path.setAttribute("d", `M ${x1} 390 Q ${midX} ${390 - height} ${x2} 390`);
                    path.setAttribute("stroke", "var(--oxford-gold)");
                    path.setAttribute("fill", "none");
                    path.setAttribute("stroke-width", "2");
                    svg.appendChild(path);
                }
            }
        });
    }

    // --- UPDATED MOUSE HANDLER FOR LINKING ---
    canvas.onmousedown = (e) => {
        const rect = canvas.getBoundingClientRect();
        const mx = (e.clientX - rect.left) / zoomLevel;
        const my = (e.clientY - rect.top) / zoomLevel;

        const clicked = elements.find(el => el.type === 'text' && Math.abs(el.x - mx) < 60 && Math.abs(el.y - my) < 25);

        if (isLinkMode && clicked) {
            if (!linkSource) {
                linkSource = clicked; // Select the dependent
            } else {
                linkSource.parentId = clicked.id; // Select the head
                linkSource = null;
                alert("Relationship Linked!");
                draw();
            }
            return;
        }

        // ... existing drag logic ...
        if (clicked) {
            isDragging = true;
            selectedElements = [clicked];
            dragOffset = {x: mx - clicked.x, y: my - clicked.y};
        }
        draw();
    };

    // --- STANDARD CANVAS LOGIC ---
    let isDragging = false;
    let dragOffset = {x:0, y:0};

    function addShape(type, x=500, y=500, val=null) {
        if (type === 'text' && !val) val = prompt("Label:");
        elements.push({ id: Date.now() + Math.random(), type, x, y, val, w: 120, h: 40, flip: 1, parentId: null });
        draw();
        updateWordBank();
    }

    function updateWordBank() {
        const words = document.getElementById('passageInput').value.split(/\s+/).filter(w => w.length > 0);
        const bank = document.getElementById('word-bank');
        bank.innerHTML = '';
        words.forEach(word => {
            const span = document.createElement('span');
            span.className = 'bank-word';
            span.innerText = word;
            span.draggable = true;
            span.ondragstart = (e) => e.dataTransfer.setData("text", word);
            bank.appendChild(span);
        });
    }

    canvas.ondragover = e => e.preventDefault();
    canvas.ondrop = e => {
        const rect = canvas.getBoundingClientRect();
        addShape('text', (e.clientX - rect.left), (e.clientY - rect.top), e.dataTransfer.getData("text"));
    };

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        elements.forEach(el => {
            ctx.beginPath();
            ctx.lineWidth = 2.5;
            ctx.strokeStyle = (linkSource === el) ? "var(--oxford-gold)" : "#333";
            
            if (el.type === 'text') {
                ctx.font = "italic 20px Georgia";
                ctx.fillText(el.val, el.x, el.y);
                // Draw relationship indicator
                if (el.parentId) {
                    ctx.fillStyle = "var(--oxford-gold)";
                    ctx.beginPath(); ctx.arc(el.x - 10, el.y - 15, 4, 0, Math.PI*2); ctx.fill();
                }
            } else if (el.type === 'subject_baseline') {
                ctx.moveTo(el.x - 60, el.y); ctx.lineTo(el.x + 120, el.y);
                ctx.moveTo(el.x, el.y - 30); ctx.lineTo(el.x, el.y + 30);
            } else if (el.type === 'modifier') {
                ctx.moveTo(el.x, el.y); ctx.lineTo(el.x + 40, el.y + 60);
            }
            ctx.stroke();
        });
    }

    window.onmousemove = (e) => {
        if (isDragging) {
            const rect = canvas.getBoundingClientRect();
            selectedElements[0].x = (e.clientX - rect.left) / zoomLevel - dragOffset.x;
            selectedElements[0].y = (e.clientY - rect.top) / zoomLevel - dragOffset.y;
            draw();
        }
    };
    window.onmouseup = () => isDragging = false;

</script>
</body>
</html>
