<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Σyntaxis Diagrammer</title>
    <style>
        :root { --sidebar-width: 380px; --right-sidebar-width: 320px; --bg-main: #e4e7ea; --oxford-navy: #1B263B; --oxford-navy-dark: #121A2A; --oxford-cream: #F8F5EE; --oxford-gold: #C5A059; --oxford-crimson: #8C1C13; --rustic-orange: #C86428; --radius-small: 8px; --radius-medium: 12px; }
        body { margin: 0; display: flex; height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; background: var(--bg-main); }
        #sidebar { width: var(--sidebar-width); background: var(--oxford-navy); flex-shrink: 0; border-right: 1px solid var(--oxford-navy-dark); display: flex; flex-direction: column; z-index: 100; box-shadow: 2px 0 15px rgba(0,0,0,0.15); color: var(--oxford-cream); }
        .sidebar-inner { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; overflow-y: auto; gap: 15px; }
        #right-sidebar { width: var(--right-sidebar-width); background: var(--oxford-navy); flex-shrink: 0; border-left: 1px solid var(--oxford-navy-dark); display: flex; flex-direction: column; z-index: 90; box-shadow: -2px 0 15px rgba(0,0,0,0.15); color: var(--oxford-cream); }
        .right-inner { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; overflow-y: auto; gap: 15px; }
        h2 { margin: 0; font-family: Georgia, serif; font-size: 24px; }
        .ix { font-size: 14px; text-decoration: overline; margin-left: 4px; font-weight: bold; color: var(--oxford-gold); }
        h3 { margin: 0; font-size: 12px; color: var(--oxford-gold); text-transform: uppercase; letter-spacing: 1px; font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px; }
        input[type="text"], textarea, select { width: 100%; box-sizing: border-box; border-radius: var(--radius-small); border: 1px solid var(--oxford-navy-dark); padding: 10px; font-family: inherit; font-size: 13px; color: var(--oxford-navy); background: var(--oxford-cream); outline: none; }
        textarea { height: 100px; resize: vertical; line-height: 1.4; }
        .palette { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .tool { padding: 10px; border: 1px solid var(--oxford-navy-dark); border-radius: var(--radius-medium); text-align: center; background: var(--oxford-cream); cursor: pointer; color: var(--oxford-navy); font-size: 11px; font-weight: bold; transition: 0.1s; }
        .tool:hover { background: #fff; transform: translateY(-1px); }
        .tool svg { width: 24px; height: 24px; stroke: var(--oxford-navy); fill: none; stroke-width: 3.5; display: block; margin: 0 auto 5px; }
        .std-btn { border: none; padding: 10px; border-radius: var(--radius-small); cursor: pointer; font-weight: bold; font-size: 11px; text-transform: uppercase; background: var(--oxford-gold); color: var(--oxford-navy); }
        .btn-group { display: flex; gap: 5px; }
        .btn-group button { flex: 1; background: var(--oxford-navy-dark); color: var(--oxford-cream); border: 1px solid rgba(255,255,255,0.1); padding: 8px; border-radius: var(--radius-small); cursor: pointer; font-size: 11px; font-weight: bold; }
        .btn-group button.active { background: var(--oxford-gold); color: var(--oxford-navy); }
        #canvas-viewport { flex-grow: 1; overflow: auto; position: relative; background: var(--bg-main); }
        canvas { background: #fff; display: block; cursor: crosshair; }
        .app-nav { display: flex; gap: 5px; }
        .app-nav a { flex: 1; text-align: center; padding: 8px 4px; font-size: 9px; color: #F8F5EE; text-decoration: none; text-transform: uppercase; font-weight: bold; background: #121A2A; border-radius: 4px; border: 1px solid rgba(255,255,255,0.05); }
        .app-nav a.active { background: #C5A059; color: #121A2A; }
        #word-bank { height: 200px; overflow-y: auto; padding: 10px; display: flex; flex-wrap: wrap; gap: 6px; background: var(--oxford-navy-dark); border-radius: var(--radius-medium); }
        .bank-word { font-family: Georgia, serif; font-size: 16px; color: var(--oxford-cream); cursor: grab; padding: 3px 6px; border-radius: 4px; }
        #context-menu { position: fixed; display: none; background: var(--oxford-cream); border: 1px solid var(--oxford-navy-dark); border-radius: 6px; z-index: 5000; padding: 5px 0; min-width: 140px; }
        .context-item { padding: 8px 15px; font-size: 12px; cursor: pointer; color: var(--oxford-navy); font-weight: bold; }
        .context-item:hover { background: #e8e2d2; }
        #block-modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 4000; align-items: center; justify-content: center; backdrop-filter: blur(2px); }
        #block-modal { background: var(--oxford-cream); padding: 20px; border-radius: var(--radius-medium); width: 600px; display: flex; flex-direction: column; gap: 15px; }
        #block-input { height: 300px; white-space: pre-wrap; font-family: monospace; font-size: 16px; }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="sidebar-inner">
        <h2>Σyntaxis<span class="ix">IX</span></h2>
        <div class="app-nav">
            <a href="annotator.html">Annotate</a>
            <a href="app.html" class="active">Diagram</a>
            <a href="interpreter.html">Interpret</a>
            <a href="outliner.html">Outline</a>
        </div>
        <div class="btn-group">
            <button id="tab-rk" class="active" onclick="switchTab('rk')">Sentence</button>
            <button id="tab-block" onclick="switchTab('block')">Block / Flow</button>
        </div>
        <input type="text" id="projectName" placeholder="Diagram Name">
        <input type="text" id="verseReference" placeholder="Ref (e.g. Rom 1:1)">
        <button class="std-btn" onclick="saveToApp()">Save Project</button>
        
        <div id="palette-rk" class="palette">
            <div class="tool" onclick="addShape('subject_baseline')"><svg viewBox="0 0 100 100"><line x1="10" y1="50" x2="90" y2="50"/><line x1="50" y1="35" x2="50" y2="65"/></svg>Baseline</div>
            <div class="tool" onclick="addShape('direct_object')"><svg viewBox="0 0 100 100"><polyline points="30,20 30,70 80,70"/></svg>Object</div>
            <div class="tool" onclick="addShape('modifier')"><svg viewBox="0 0 100 100"><polyline points="30,20 50,70 95,70"/></svg>Modifier</div>
            <div class="tool" onclick="addShape('fork')"><svg viewBox="0 0 100 100"><path d="M10,50 L30,50 L50,20 L90,20 M30,50 L50,80 L90,80"/></svg>Fork</div>
            <div class="tool" onclick="addShape('text')"><strong>Label</strong></div>
        </div>
        <div id="palette-block" class="palette" style="display:none;">
            <div class="tool" onclick="openBlockModal()" style="grid-column: span 3;">📝 Add Text Block</div>
            <div class="tool" onclick="addLabeledArrow()" style="grid-column: span 3;">➔ Orthogonal Arrow</div>
        </div>
        <button class="std-btn" style="background:#8C1C13; color:white;" onclick="elements=[]; draw();">Clear Canvas</button>
    </div>
</div>

<div id="canvas-viewport">
    <canvas id="mainCanvas"></canvas>
</div>

<div id="right-sidebar">
    <div class="right-inner">
        <h3>Text Source</h3>
        <input type="text" id="dbRefInput" placeholder="Passage Ref">
        <select id="dbModuleSelect">
            <option value="tischendorf.xml">Tischendorf Greek NT</option>
            <option value="srgnt.tsv">SRGNT Greek</option>
            <option value="esv.xml">English ESV</option>
        </select>
        <button class="std-btn" onclick="loadBibleText()">Extract Text</button>
        <div id="dbStatus"></div>
        <textarea id="passageInput" placeholder="Or paste text..." oninput="updateWordBank()"></textarea>
        <h3>Word Bank</h3>
        <div id="word-bank"></div>
        <h3>Textual Variants & Notes</h3>
        <textarea id="textualVariants" placeholder="Variants, apparatus notes, or observations..." oninput="autoSave()"></textarea>
    </div>
</div>

<div id="block-modal-overlay">
    <div id="block-modal">
        <h3>Edit Text Block</h3>
        <textarea id="block-input"></textarea>
        <div class="btn-group">
            <button class="std-btn" onclick="closeBlockModal()">Cancel</button>
            <button class="std-btn" onclick="submitBlock()">Submit</button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('mainCanvas'); const ctx = canvas.getContext('2d');
    let elements = [], selectedElements = [], zoomLevel = 1, activeTab = 'rk', editingId = null;
    canvas.width = 4000; canvas.height = 4000;

    function switchTab(t) {
        activeTab = t;
        document.getElementById('tab-rk').className = (t==='rk'?'active':'');
        document.getElementById('tab-block').className = (t==='block'?'active':'');
        document.getElementById('palette-rk').style.display = (t==='rk'?'grid':'none');
        document.getElementById('palette-block').style.display = (t==='block'?'grid':'none');
    }

    async function loadBibleText() {
        const ref = document.getElementById('dbRefInput').value;
        const mod = document.getElementById('dbModuleSelect').value;
        const status = document.getElementById('dbStatus');
        if(!ref) return;
        status.innerText = "Loading...";
        try {
            const res = await fetch(mod);
            const txt = await res.text();
            document.getElementById('passageInput').value = "Passage loaded from " + mod;
            updateWordBank();
            status.innerText = "Success!";
        } catch(e) { status.innerText = "Error loading file."; }
    }

    function updateWordBank() {
        const bank = document.getElementById('word-bank');
        const words = document.getElementById('passageInput').value.split(/\s+/);
        bank.innerHTML = '';
        words.forEach(w => {
            if(!w) return;
            const s = document.createElement('span'); s.className = 'bank-word'; s.innerText = w;
            s.draggable = true;
            s.ondragstart = (e) => e.dataTransfer.setData("text", w);
            bank.appendChild(s);
        });
    }

    canvas.ondragover = e => e.preventDefault();
    canvas.ondrop = e => {
        const val = e.dataTransfer.getData("text");
        const rect = canvas.getBoundingClientRect();
        addShape('text', (e.clientX - rect.left), (e.clientY - rect.top), val);
    };

    function addShape(type, x=500, y=500, val='') {
        elements.push({ id: Date.now(), type, x, y, w: 200, h: 50, val, color: '#000', thickness: 2 });
        draw();
    }

    function openBlockModal() { document.getElementById('block-modal-overlay').style.display='flex'; }
    function closeBlockModal() { document.getElementById('block-modal-overlay').style.display='none'; }
    function submitBlock() {
        addShape('block_text', 500, 500, document.getElementById('block-input').value);
        closeBlockModal();
    }

    function draw() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        elements.forEach(el => {
            ctx.strokeStyle = el.color; ctx.lineWidth = el.thickness;
            if(el.type === 'text') {
                ctx.font = "italic 20px Georgia";
                ctx.fillText(el.val, el.x, el.y);
            } else if(el.type === 'block_text') {
                ctx.strokeRect(el.x, el.y, el.w, el.h);
                ctx.font = "14px monospace";
                ctx.fillText(el.val.substring(0,20) + "...", el.x+5, el.y+20);
            } else {
                ctx.beginPath(); ctx.moveTo(el.x, el.y); ctx.lineTo(el.x+el.w, el.y); ctx.stroke();
            }
        });
    }

    function autoSave() {
        const data = {
            project: document.getElementById('projectName').value,
            ref: document.getElementById('verseReference').value,
            variants: document.getElementById('textualVariants').value,
            elements
        };
        localStorage.setItem('syntaxis_last_save', JSON.stringify(data));
    }
</script>
</body>
</html>
