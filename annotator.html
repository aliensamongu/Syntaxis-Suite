<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Σyntaxis Annotator | Master Editor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --sidebar-width: 320px;
            --bg-main: #e4e7ea;
            --oxford-navy: #1B263B;
            --oxford-navy-dark: #121A2A;
            --oxford-cream: #F8F5EE;
            --oxford-gold: #C5A059;
            --oxford-crimson: #8C1C13;
            --radius-small: 8px;
            --radius-medium: 12px;
        }

        body { margin: 0; display: flex; height: 100vh; font-family: -apple-system, sans-serif; overflow: hidden; background: var(--bg-main); }
        
        #sidebar { width: var(--sidebar-width); background: var(--oxford-navy); border-right: 1px solid var(--oxford-navy-dark); display: flex; flex-direction: column; color: var(--oxford-cream); box-shadow: 2px 0 15px rgba(0,0,0,0.15); z-index: 100; }
        .sidebar-inner { padding: 25px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; }
        
        /* APP NAVIGATION TABS */
        .app-nav { display: flex; gap: 5px; margin-bottom: 5px; }
        .app-nav a { flex: 1; text-align: center; padding: 8px 4px; font-size: 9px; color: var(--oxford-cream); text-decoration: none; text-transform: uppercase; font-weight: bold; letter-spacing: 1px; background: var(--oxford-navy-dark); border: 1px solid rgba(255,255,255,0.05); border-radius: 4px; transition: 0.2s; }
        .app-nav a:hover { border-color: var(--oxford-gold); }
        .app-nav a.active { background: var(--oxford-gold); color: var(--oxford-navy-dark); border-color: var(--oxford-gold); }

        h2 { margin: 0; font-family: Georgia, serif; font-size: 24px; }
        h3 { margin: 0; font-size: 11px; color: var(--oxford-gold); text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px; }

        textarea { width: 100%; box-sizing: border-box; border-radius: var(--radius-small); padding: 10px; font-size: 13px; background: var(--oxford-cream); height: 80px; resize: none; border: 1px solid var(--oxford-navy-dark); outline: none; }
        .std-btn { border: none; padding: 10px; border-radius: var(--radius-small); cursor: pointer; font-weight: bold; font-size: 11px; text-transform: uppercase; background: var(--oxford-gold); color: var(--oxford-navy); width: 100%; transition: 0.2s; }
        
        #workspace { flex-grow: 1; position: relative; overflow: auto; padding: 60px; display: flex; gap: 40px; align-items: flex-start; }
        #text-canvas { flex-grow: 1; max-width: 800px; background: white; padding: 60px; border-radius: var(--radius-medium); box-shadow: 0 5px 20px rgba(0,0,0,0.05); font-family: Georgia, serif; font-size: 24px; line-height: 2.8; position: relative; z-index: 10; min-height: 70vh; }
        
        .word { display: inline-block; padding: 0 4px; border-radius: 4px; cursor: pointer; position: relative; }
        .word.selected { outline: 2px dashed var(--oxford-gold); background: rgba(197, 160, 89, 0.1); }
        .grammar-tag { position: absolute; top: -14px; left: 50%; transform: translateX(-50%); font-size: 10px; font-family: sans-serif; font-weight: 800; color: white; padding: 1px 4px; border-radius: 3px; line-height: 1; pointer-events: none; white-space: nowrap; }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="sidebar-inner">
        <h2>Σyntaxis</h2>
        
        <div class="app-nav">
            <a href="annotator.html" class="active">Annotate</a>
            <a href="app.html">Diagram</a>
            <a href="interpreter.html">Interpret</a>
            <a href="outliner.html">Outline</a>
        </div>

        <div>
            <h3>Passage Input</h3>
            <textarea id="rawTextInput" placeholder="Paste Greek or English here..."></textarea>
            <button class="std-btn" onclick="renderText()" style="margin-top:8px;">Render Canvas</button>
        </div>
        
        <div style="margin-top: auto;">
            <button class="std-btn" style="background: #27ae60; color: white; margin-bottom:8px;" onclick="exportSnapshot()">📸 Snapshot (PNG)</button>
        </div>
    </div>
</div>

<div id="workspace">
    <div id="text-canvas"></div>
</div>

<script>
    const canvas = document.getElementById('text-canvas');
    function renderText() {
        const raw = document.getElementById('rawTextInput').value;
        canvas.innerHTML = '';
        const words = raw.split(/(\s+)/);
        words.forEach(chunk => {
            if (chunk.trim() === '') {
                canvas.appendChild(document.createTextNode(chunk));
            } else {
                const span = document.createElement('span');
                span.className = 'word'; 
                span.innerText = chunk;
                span.onclick = () => span.classList.toggle('selected');
                canvas.appendChild(span);
            }
        });
    }
    function exportSnapshot() {
        html2canvas(document.getElementById('workspace'), { backgroundColor: '#e4e7ea' }).then(canvasOutput => {
            const link = document.createElement('a');
            link.download = 'annotator_snapshot.png';
            link.href = canvasOutput.toDataURL();
            link.click();
        });
    }
</script>
</body>
</html>
