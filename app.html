<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Σyntaxis IX | Master Editor</title>
    <style>
        :root { --sidebar-width: 380px; --right-sidebar-width: 320px; --bg-main: #e4e7ea; --oxford-navy: #1B263B; --oxford-navy-dark: #121A2A; --oxford-cream: #F8F5EE; --oxford-gold: #C5A059; --oxford-crimson: #8C1C13; --rustic-orange: #C86428; --radius-small: 8px; --radius-medium: 12px; }
        body { margin: 0; display: flex; height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; background: var(--bg-main); }
        #sidebar { width: var(--sidebar-width); background: var(--oxford-navy); flex-shrink: 0; border-right: 1px solid var(--oxford-navy-dark); display: flex; flex-direction: column; z-index: 100; box-shadow: 2px 0 15px rgba(0,0,0,0.15); color: var(--oxford-cream); }
        .sidebar-inner { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; overflow-y: auto; gap: 10px; }
        #right-sidebar { width: var(--right-sidebar-width); background: var(--oxford-navy); flex-shrink: 0; border-left: 1px solid var(--oxford-navy-dark); display: flex; flex-direction: column; z-index: 90; box-shadow: -2px 0 15px rgba(0,0,0,0.15); color: var(--oxford-cream); }
        .right-inner { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; overflow-y: auto; gap: 10px; }
        h2 { margin: 0; font-family: Georgia, serif; font-size: 24px; }
        .ix { font-size: 14px; text-decoration: overline; margin-left: 4px; font-weight: bold; color: var(--oxford-gold); }
        h3 { margin: 0; font-size: 12px; color: var(--oxford-gold); text-transform: uppercase; letter-spacing: 1px; font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px; }
        input[type="text"], textarea, select { width: 100%; box-sizing: border-box; border-radius: var(--radius-small); border: 1px solid var(--oxford-navy-dark); padding: 10px; font-family: inherit; font-size: 13px; color: var(--oxford-navy); background: var(--oxford-cream); outline: none; }
        .app-nav { display: flex; gap: 5px; margin-bottom: 10px; }
        .app-nav a { flex: 1; text-align: center; padding: 8px 4px; font-size: 9px; color: #F8F5EE; text-decoration: none; text-transform: uppercase; font-weight: bold; background: #121A2A; border-radius: 4px; border: 1px solid rgba(255,255,255,0.05); }
        .app-nav a.active { background: #C5A059; color: #121A2A; }
        .palette { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 5px; }
        .tool { padding: 10px; border: 1px solid var(--oxford-navy-dark); border-radius: var(--radius-medium); text-align: center; background: var(--oxford-cream); cursor: pointer; color: var(--oxford-navy); font-size: 10px; font-weight: bold; transition: 0.1s; }
        .tool:hover { background: #fff; transform: translateY(-1px); }
        .tool svg { width: 22px; height: 22px; stroke: var(--oxford-navy); fill: none; stroke-width: 3.5; display: block; margin: 0 auto 5px; }
        .std-btn { border: none; padding: 10px; border-radius: var(--radius-small); cursor: pointer; font-weight: bold; font-size: 11px; text-transform: uppercase; background: var(--oxford-gold); color: var(--oxford-navy); }
        .btn-group { display: flex; gap: 5px; margin-bottom: 5px; }
        .btn-group button { flex: 1; background: var(--oxford-navy-dark); color: var(--oxford-cream); border: 1px solid rgba(255,255,255,0.1); padding: 8px; border-radius: var(--radius-small); cursor: pointer; font-size: 11px; font-weight: bold; }
        .btn-group button.active { background: var(--oxford-gold); color: var(--oxford-navy); }
        #canvas-viewport { flex-grow: 1; overflow: auto; position: relative; background: var(--bg-main); }
        canvas { background: #fff; display: block; box-shadow: 0 0 20px rgba(0,0,0,0.05); }
        #word-bank { height: 200px; overflow-y: auto; padding: 10px; display: flex; flex-wrap: wrap; gap: 6px; background: var(--oxford-navy-dark); border-radius: var(--radius-medium); }
        .bank-word { font-family: Georgia, serif; font-size: 16px; color: var(--oxford-cream); cursor: grab; padding: 3px 6px; border-radius: 4px; }
        #apparatus-drawer { position: fixed; top: 0; right: -400px; width: 380px; height: 100vh; background: var(--oxford-navy); box-shadow: -5px 0 25px rgba(0,0,0,0.3); transition: right 0.3s; z-index: 2000; display: flex; flex-direction: column; border-left: 1px solid var(--oxford-navy-dark); color: var(--oxford-cream); }
        #apparatus-drawer.open { right: 0; }
        .apparatus-header { padding: 20px; border-bottom: 1px solid var(--oxford-navy-dark); display: flex; justify-content: space-between; align-items: center; background: var(--oxford-navy-dark); }
        .apparatus-content { padding: 20px; overflow-y: auto; flex-grow: 1; }
        .ms-card { border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 12px; margin-bottom: 10px; background: rgba(255,255,255,0.03); }
        .ms-symbol { color: var(--oxford-gold); font-size: 18px; font-weight: bold; }
        .quick-keys { display: flex; gap: 4px; margin-bottom: 10px; }
        .quick-key { flex: 1; background: var(--oxford-navy-dark); border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; cursor: pointer; padding: 6px 0; color: white; }
        #variant-modal { display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(27, 38, 59, 0.98); z-index: 3000; padding: 20px; flex-direction: column; gap: 8px; }
        #variant-modal.active { display: flex; }
        #block-modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 4000; align-items: center; justify-content: center; backdrop-filter: blur(2px); }
        #block-modal { background: var(--oxford-cream); padding: 20px; border-radius: 12px; width: 500px; display: flex; flex-direction: column; gap: 10px; }
        #block-input { height: 200px; font-family: monospace; font-size: 15px; }
    </style>
</head>
<body>
<div id="sidebar">
    <div class="sidebar-inner">
        <h2>Σyntaxis<span class="ix">IX</span></h2>
        <div class="app-nav">
            <a href="annotator.html">Annotate</a><a href="app.html" class="active">Diagram</a><a href="interpreter.html">Interpret</a><a href="outliner.html">Outline</a>
        </div>
        <div class="btn-group">
            <button id="tab-rk" class="active" onclick="switchTab('rk')">Sentence</button>
            <button id="tab-block" onclick="switchTab('block')">Block / Flow</button>
        </div>
        <input type="text" id="projectName" placeholder="Diagram Name">
        <input type="text" id="verseReference" placeholder="Ref (e.g. Col 1:4)">
        <button class="std-btn" onclick="saveToApp()">Save App</button>
        <div id="palette-rk" class="palette">
            <div class="tool" onclick="addShape('subject_baseline')"><svg viewBox="0 0 100 100"><line x1="10" y1="50" x2="90" y2="50"/><line x1="50" y1="35" x2="50" y2="65"/></svg>Baseline</div>
            <div class="tool" onclick="addShape('direct_object')"><svg viewBox="0 0 100 100"><polyline points="30,20 30,70 80,70"/></svg>Object</div>
            <div class="tool" onclick="addShape('modifier')"><svg viewBox="0 0 100 100"><polyline points="30,20 50,70 95,70"/></svg>Modifier</div>
            <div class="tool" onclick="addShape('appositive')"><svg viewBox="0 0 100 100"><polyline points="30,20 30,70 80,70"/></svg>Participle</div>
            <div class="tool" onclick="addShape('stilt')"><svg viewBox="0 0 100 100"><line x1="10" y1="30" x2="90" y2="30"/><line x1="50" y1="30" x2="50" y2="60"/></svg>Stilt</div>
            <div class="tool" onclick="addShape('fork')"><svg viewBox="0 0 100 100"><path d="M10,50 L30,50 L50,20 L90,20 M30,50 L50,80 L90,80"/></svg>Fork</div>
            <div class="tool" onclick="addShape('diamond')"><svg viewBox="0 0 100 100"><path d="M5,50 L25,50 L45,20 L75,20 L95,50 L75,80 L45,80 L25,50"/></svg>Compound</div>
            <div class="tool" onclick="addShape('x_line')"><svg viewBox="0 0 100 100"><line x1="30" y1="30" x2="70" y2="70"/><line x1="70" y1="30" x2="30" y2="70"/></svg>Understood</div>
            <div class="tool" onclick="addShape('text')"><strong>Label</strong></div>
            <button class="std-btn" onclick="toggleApparatus()" style="background:#fff; color:var(--oxford-navy); grid-column: span 3; margin-top:5px;">📜 Apparatus</button>
        </div>
        <div id="palette-block" class="palette" style="display:none;">
            <div class="tool" onclick="openBlockModal()" style="grid-column: span 3;">📝 Add Text Block</div>
            <div class="tool" onclick="addLabeledArrow()" style="grid-column: span 3;">➔ Orthogonal Arrow</div>
        </div>
        <div style="display:flex; gap:5px; margin-top:10px;">
            <button class="std-btn" onclick="flipSelected()" style="flex:1; background:var(--oxford-navy-dark); color:white;">Flip (F)</button>
            <button class="std-btn" onclick="setZoom(0.1)" style="background:#fff; color:#000;">+</button>
            <button class="std-btn" onclick="setZoom(-0.1)" style="background:#fff; color:#000;">-</button>
        </div>
        <button class="std-btn" style="background:var(--oxford-crimson); color:white; margin-top:5px;" onclick="if(confirm('Clear?')){elements=[]; draw();}">Clear Canvas</button>
    </div>
</div>
<div id="canvas-viewport"><canvas id="mainCanvas"></canvas></div>
<div id="right-sidebar">
    <div class="right-inner">
        <h3>Text Source</h3>
        <input type="text" id="dbRefInput" placeholder="Passage (e.g. Col 1:1-8)">
        <select id="dbModuleSelect">
            <option value="tischendorf.xml">Tischendorf Greek</option>
            <option value="srgnt.tsv">SRGNT TSV</option>
            <option value="hebrew_ot.xml">Hebrew OT</option>
            <option value="esv.xml">English ESV</option>
        </select>
        <button class="std-btn" onclick="extractText()">Extract Text</button>
        <div id="dbStatus" style="font-size:10px; color:var(--oxford-gold); text-align:center;"></div>
        <textarea id="passageInput" placeholder="Paste here..." oninput="updateWordBank()"></textarea>
        <div id="word-bank"></div>
    </div>
</div>
<div id="apparatus-drawer">
    <div class="apparatus-header"><h3>Apparatus</h3><button class="close-btn" onclick="toggleApparatus()">&times;</button></div>
    <div class="apparatus-content">
        <div id="apparatus-list"></div>
        <button class="std-btn" onclick="openVariantModal()" style="width:100%;">+ Add Reading</button>
        <button class="std-btn" onclick="launchCNTR()" style="width:100%; margin-top:10px;">Verify on CNTR ↗</button>
        <div id="variant-modal">
            <h4>MS Reading</h4>
            <div class="quick-keys">
                <button class="quick-key" onclick="insSig('𝔓')">𝔓</button><button class="quick-key" onclick="insSig('א')">א</button><button class="quick-key" onclick="insSig('B')">B</button><button class="quick-key" onclick="insSig('𝔪')">𝔪</button>
            </div>
            <input type="text" id="v-symbol" placeholder="Symbol">
            <select id="v-con"><option value="highly">Highly Likely</option><option value="likely">Likely</option></select>
            <textarea id="v-read" placeholder="Reading..."></textarea>
            <button class="std-btn" onclick="saveVar()">Save</button><button class="std-btn" onclick="closeVariantModal()" style="background:#333;color:#fff;">Cancel</button>
        </div>
    </div>
</div>
<div id="block-modal-overlay"><div id="block-modal"><h3>Text Block</h3><textarea id="block-input"></textarea><div style="display:flex; gap:10px;"><button class="std-btn" onclick="closeBlockModal()" style="background:#333; color:white;">Cancel</button><button class="std-btn" onclick="submitBlock()">Add</button></div></div></div>
<script>
    const canvas=document.getElementById('mainCanvas'), ctx=canvas.getContext('2d');
    let elements=[], selectedElements=[], apparatusData=[], zoomLevel=1, activeTab='rk', isResizing=false, currentResPt=null;
    canvas.width=4000; canvas.height=4000;
    const bMap={"colossians":51,"matthew":40,"mark":41,"luke":42,"john":43,"acts":44,"romans":45}, abMap={"col":"colossians","matt":"matthew","rom":"romans"};

    function switchTab(t){ activeTab=t; document.getElementById('tab-rk').className=(t==='rk'?'active':''); document.getElementById('tab-block').className=(t==='block'?'active':''); document.getElementById('palette-rk').style.display=(t==='rk'?'grid':'none'); document.getElementById('palette-block').style.display=(t==='block'?'grid':'none'); }
    function setZoom(d){ zoomLevel=Math.max(0.1, zoomLevel+d); canvas.style.transform=`scale(${zoomLevel})`; canvas.style.transformOrigin='top left'; }
    function toggleApparatus(){ document.getElementById('apparatus-drawer').classList.toggle('open'); renderApp(); }
    function openVariantModal(){ document.getElementById('variant-modal').classList.add('active'); }
    function closeVariantModal(){ document.getElementById('variant-modal').classList.remove('active'); }
    function insSig(s){ document.getElementById('v-symbol').value+=s; }

    async function extractText() {
        const q=document.getElementById('dbRefInput').value, mod=document.getElementById('dbModuleSelect').value, st=document.getElementById('dbStatus');
        st.innerText="Loading...";
        try {
            const res=await fetch(mod), text=await res.text(), m=q.match(/(\w+)\s*(\d+):(\d+)-?(\d+)?/);
            if(!m) throw new Error();
            const bNum=bMap[abMap[m[1].toLowerCase()]||m[1].toLowerCase()], chap=m[2], start=parseInt(m[3]), end=m[4]?parseInt(m[4]):start;
            let out="";
            if(mod.endsWith('.tsv')){
                const prefix=bNum.toString().padStart(2,'0')+chap.padStart(3,'0');
                text.split('\n').forEach(l=>{ if(l.startsWith(prefix)){ const v=parseInt(l.substring(5,8)); if(v>=start && v<=end) out+=l.split('\t')[1]+" "; }});
            } else {
                const xml=new DOMParser().parseFromString(text,"text/xml");
                xml.querySelectorAll('VERS, verse').forEach(v=>{ 
                    const vNum=parseInt(v.getAttribute('vnumber')||v.getAttribute('number'));
                    if(vNum>=start && vNum<=end) out+=v.textContent+" ";
                });
            }
            document.getElementById('passageInput').value=out.trim(); updateWordBank(); st.innerText="Success!";
        } catch(e){ st.innerText="Error: Ref not found."; }
    }

    function addShape(type, x=500, y=500, val=''){ elements.push({id:Date.now(), type, x, y, w:150, h:60, dx:50, dy:-40, val, flip:1, color:'#000', thickness:2.5}); draw(); }
    function updateWordBank(){ const b=document.getElementById('word-bank'); b.innerHTML=''; document.getElementById('passageInput').value.split(/\s+/).forEach(w=>{ if(!w) return; let s=document.createElement('span'); s.className='bank-word'; s.innerText=w; s.draggable=true; s.ondragstart=e=>e.dataTransfer.setData("text",w); b.appendChild(s); });}
    canvas.ondragover=e=>e.preventDefault(); canvas.ondrop=e=>{ const v=e.dataTransfer.getData("text"), r=canvas.getBoundingClientRect(); addShape('text',(e.clientX-r.left)/zoomLevel,(e.clientY-r.top)/zoomLevel,v); };

    function getHit(mx, my){
        for(let i=elements.length-1; i>=0; i--){
            const el=elements[i], f=el.flip;
            if(Math.hypot(el.x+el.w*f-mx, el.y+el.h-my)<20) return {el, pt:'end'};
            if(Math.hypot(el.x-mx, el.y-my)<20) return {el, pt:'start'};
            if(mx>Math.min(el.x, el.x+el.w*f)-10 && mx<Math.max(el.x, el.x+el.w*f)+10 && my>el.y-20 && my<el.y+20) return {el, pt:'body'};
        } return null;
    }

    canvas.onmousedown=e=>{
        const r=canvas.getBoundingClientRect(), mx=(e.clientX-r.left)/zoomLevel, my=(e.clientY-r.top)/zoomLevel, hit=getHit(mx,my);
        if(hit){ selectedElements=[hit.el]; if(hit.pt!=='body'){ isResizing=true; currentResPt=hit.pt; } } else { selectedElements=[]; } draw();
    };
    window.onmousemove=e=>{
        if(!selectedElements.length) return;
        const r=canvas.getBoundingClientRect(), mx=(e.clientX-r.left)/zoomLevel, my=(e.clientY-r.top)/zoomLevel, el=selectedElements[0];
        if(isResizing){ if(currentResPt==='end'){ el.w=(mx-el.x)/el.flip; el.h=my-el.y; } else { el.x=mx; el.y=my; } }
        else { el.x=mx-el.w/2; el.y=my-el.h/2; } draw();
    };
    window.onmouseup=()=>{ isResizing=false; };

    function draw(){
        ctx.clearRect(0,0,canvas.width,canvas.height);
        elements.forEach(el=>{
            ctx.strokeStyle=el.color; ctx.lineWidth=el.thickness; ctx.beginPath(); const f=el.flip;
            if(el.type==='subject_baseline'){ ctx.moveTo(el.x-50*f, el.y); ctx.lineTo(el.x+el.w*f, el.y); ctx.moveTo(el.x, el.y-30); ctx.lineTo(el.x, el.y+30); }
            else if(el.type==='direct_object'){ ctx.moveTo(el.x, el.y-el.h); ctx.lineTo(el.x, el.y); ctx.lineTo(el.x+el.w*f, el.y); }
            else if(el.type==='modifier'){ ctx.moveTo(el.x+el.dx*f, el.y+el.dy); ctx.lineTo(el.x, el.y); ctx.lineTo(el.x+el.w*f, el.y); }
            else if(el.type==='fork'){ ctx.moveTo(el.x,el.y); ctx.lineTo(el.x+20*f,el.y-el.h); ctx.lineTo(el.x+el.w*f,el.y-el.h); ctx.moveTo(el.x,el.y); ctx.lineTo(el.x+20*f,el.y+el.h); ctx.lineTo(el.x+el.w*f,el.y+el.h); }
            else if(el.type==='text'){ ctx.font="italic 20px Georgia"; ctx.fillText(el.val, el.x, el.y); if(apparatusData.some(v=>v.tId===el.id)){ ctx.fillStyle='orange'; ctx.beginPath(); ctx.arc(el.x+5,el.y-25,4,0,7); ctx.fill(); } }
            else { ctx.moveTo(el.x, el.y); ctx.lineTo(el.x+el.w*f, el.y+el.h); }
            ctx.stroke();
            if(selectedElements.includes(el)){ ctx.fillStyle='#3498db'; ctx.beginPath(); ctx.arc(el.x, el.y, 6, 0, 7); ctx.fill(); ctx.beginPath(); ctx.arc(el.x+el.w*f, el.y+el.h, 6, 0, 7); ctx.fill(); }
        });
    }
</script>
</body>
</html>
