<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Σyntaxis Bible Study Suite</title>
    <style>
        :root {
            --oxford-navy: #1B263B;
            --oxford-navy-dark: #121A2A;
            --oxford-cream: #F8F5EE;
            --oxford-gold: #C5A059;
            --bg-main: #e4e7ea;
        }

        body {
            margin: 0; 
            display: flex; 
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; 
            background: var(--bg-main);
        }

        /* Far-Left Global Navigation Dock */
        #global-nav {
            width: 80px;
            background: var(--oxford-navy-dark);
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
            box-shadow: 5px 0 15px rgba(0,0,0,0.3);
            z-index: 1000;
        }

        .brand-logo {
            color: var(--oxford-cream);
            font-family: Georgia, serif;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 40px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            cursor: default;
        }

        .nav-btn {
            width: 100%;
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            padding: 20px 0;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            transition: 0.2s all;
            border-left: 3px solid transparent;
        }

        .nav-btn:hover {
            color: var(--oxford-cream);
            background: rgba(255, 255, 255, 0.05);
        }

        .nav-btn.active {
            color: var(--oxford-gold);
            background: rgba(255, 255, 255, 0.05);
            border-left: 3px solid var(--oxford-gold);
        }

        .nav-icon {
            font-size: 24px;
        }

        .nav-label {
            font-size: 9px;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* The Main App Window Container */
        #app-window {
            flex-grow: 1;
            position: relative;
            background: var(--bg-main);
        }

        /* The Iframe that loads your 4 safe files */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

    </style>
</head>
<body>

    <div id="global-nav">
        <div class="brand-logo">Σ</div>

        <button class="nav-btn active" id="btn-annotator" onclick="loadApp('annotator.html', 'btn-annotator')" title="Phase 1: Observation">
            <div class="nav-icon">👁️</div>
            <div class="nav-label">Annotate</div>
        </button>

        <button class="nav-btn" id="btn-diagrammer" onclick="loadApp('diagrammer.html', 'btn-diagrammer')" title="Phase 2: Syntax & Structure">
            <div class="nav-icon">🏗️</div>
            <div class="nav-label">Diagram</div>
        </button>

        <button class="nav-btn" id="btn-interpreter" onclick="loadApp('interpreter.html', 'btn-interpreter')" title="Phase 3: Lexicon & Meaning">
            <div class="nav-icon">📖</div>
            <div class="nav-label">Interpret</div>
        </button>
        
        <button class="nav-btn" id="btn-outliner" onclick="loadApp('outliner.html', 'btn-outliner')" title="Phase 4: Outline & Application">
            <div class="nav-icon">📝</div>
            <div class="nav-label">Outline</div>
        </button>
    </div>

    <div id="app-window">
        <iframe id="main-frame" src="annotator.html"></iframe>
    </div>

    <script>
        function loadApp(file, btnId) {
            document.getElementById('main-frame').src = file;
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.getElementById(btnId).classList.add('active');
        }
    </script>
</body>
</html>
