<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Σyntaxis Interpreter | The Master Fetch Engine</title>
    
    <script src="strongs-greek-dictionary.js"></script>
    
    <style>
        :root {
            --sidebar-width: 320px;
            --lexicon-width: 380px;
            --bg-main: #e4e7ea;
            
            --oxford-navy: #1B263B;
            --oxford-navy-dark: #121A2A;
            --oxford-cream: #F8F5EE;
            --oxford-gold: #C5A059;
            --oxford-crimson: #8C1C13;
            
            --radius-small: 8px;
            --radius-medium: 12px;
        }

        body {
            margin: 0; display: flex; height: 100vh;
            font-family: -apple-system, sans-serif;
            overflow: hidden; background: var(--bg-main);
        }
        
        #sidebar {
            width: var(--sidebar-width); background: var(--oxford-navy); flex-shrink: 0;
            border-right: 1px solid var(--oxford-navy-dark); display: flex; flex-direction: column;
            padding: 25px; box-sizing: border-box; color: var(--oxford-cream); gap: 20px; overflow-y: auto;
        }
        
        h2 { margin: 0; font-family: Georgia, serif; font-size: 24px; color: var(--oxford-cream); }
        h3 { margin: 0; font-size: 11px; color: var(--oxford-gold); text-transform: uppercase; letter-spacing: 1px; font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px; }

        input[type="text"], textarea {
            width: 100%; box-sizing: border-box; border-radius: var(--radius-small);
            border: 1px solid var(--oxford-navy-dark); padding: 10px;
            font-family: inherit; font-size: 13px; background: var(--oxford-cream); outline: none;
        }
        input[type="text"]:focus { border-color: var(--oxford-gold); }
        textarea { height: 100px; resize: vertical; }

        .std-btn {
            border: none; padding: 10px; border-radius: var(--radius-small);
            cursor: pointer; font-weight: bold; font-size: 11px; text-transform: uppercase;
            background: var(--oxford-gold); color: var(--oxford-navy-dark); width: 100%; margin-top: 5px;
            transition: 0.2s;
        }
        .std-btn:hover { filter: brightness(1.1); transform: translateY(-1px); }

        .panel-box { background: rgba(0,0,0,0.2); padding: 15px; border-radius: var(--radius-small); border: 1px solid rgba(255,255,255,0.05); }

        #workspace { flex-grow: 1; overflow-y: auto; padding: 40px; display: flex; justify-content: center; align-items: flex-start; }
        
        #text-canvas { 
            width: 100%; max-width: 700px; background: white; padding: 40px; 
            border-radius: var(--radius-medium); box-shadow: 0 5px 20px rgba(0,0,0,0.05); 
            font-family: Georgia, serif; font-size: 24px; color: var(--oxford-navy-dark); 
            line-height: 2.2; cursor: text; min-height: 50vh;
        }

        .word { display: inline-block; padding: 2px 4px; margin: 0 2px; border-radius: 4px; cursor: pointer; transition: 0.2s; position: relative;}
        .word:hover { background-color: rgba(0,0,0,0.05); }
        .word.selected { background-color: var(--oxford-gold); color: var(--oxford-navy-dark); font-weight: bold; }
        
        .word.has-tag { border-bottom: 2px dashed var(--oxford-gold); }

        #lexicon-panel {
            width: var(--lexicon-width); background: white; flex-shrink: 0;
            border-left: 1px solid #d1d5da; display: flex; flex-direction: column;
            box-shadow: -2px 0 15px rgba(0,0,0,0.05);
        }

        .lexicon-header { background: var(--oxford-navy-dark); color: var(--oxford-cream); padding: 20px; font-family: Georgia, serif; text-align: center; }
        .lexicon-header h2 { font-size: 20px; margin: 0 0 15px 0; }

        .strongs-search-container { display: flex; gap: 5px; }
        .strongs-input { flex-grow: 1; padding: 8px; border-radius: 4px; border: none; font-family: monospace; font-size: 14px; text-transform: uppercase; }
        .strongs-btn { background: var(--oxford-gold); color: var(--oxford-navy-dark); border: none; border-radius: 4px; padding: 0 15px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 11px; }

        .api-content { padding: 25px; overflow-y: auto; flex-grow: 1; }
        .loader { font-size: 14px; color: #666; text-align: center; display: none; font-style: italic; }

        .api-word { font-family: Georgia, serif; font-size: 32px; color: var(--oxford-navy); margin: 0 0 5px 0; border-bottom: 2px solid var(--oxford-gold); padding-bottom: 5px; display: flex; justify-content: space-between; align-items: baseline; }
        .strongs-tag { font-family: -apple-system, sans-serif; font-size: 12px; font-weight: bold; color: var(--oxford-crimson); background: rgba(140, 28, 19, 0.1); padding: 3px 8px; border-radius: 12px; letter-spacing: 1px;}
        .api-phonetic { font-size: 14px; color: #666; margin-bottom: 20px; font-family: monospace; }
        .api-pos { font-size: 11px; text-transform: uppercase; font-weight: bold; color: var(--oxford-crimson); margin-top: 15px; letter-spacing: 1px; }
        .api-def { font-size: 15px; line-height: 1.5; color: #333; margin: 5px 0 15px 0; padding-left: 10px; border-left: 3px solid var(--bg-main); }
        .empty-state { text-align: center; color: #aaa; font-style: italic; margin-top: 50px; }

        .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--oxford-crimson); margin-right: 5px; }
        .status-dot.active { background: #5a9e69; }
    </style>
</head>
<body>

<div id="sidebar">
    <h2>Σyntaxis <span style="font-weight: 300;">Interpreter</span></h2>
    
    <div class="panel-box">
        <h3 style="display: flex; justify-content: space-between; align-items: center;">
            Option A: Auto-Fetch
            <span id="db-status" style="color: #aaa; font-weight: normal; text-transform: none;"><span class="status-dot"></span>No DB Loaded</span>
        </h3>
        
        <input type="file" id="csvFileInput" accept=".csv, .tsv, .txt" style="display:none;" onchange="loadBSB(event)">
        <button class="std-btn" style="background: white; color: var(--oxford-navy-dark); margin-bottom: 15px;" onclick="document.getElementById('csvFileInput').click()">📁 Load BSB Database</button>
        
        <input type="text" id="verseReference" placeholder="e.g. John 1:1">
        <button class="std-btn" onclick="fetchVerse()">Fetch Tagged Verse</button>
    </div>

    <div style="text-align: center; color: #aaa; font-size: 12px; font-style: italic;">— OR —</div>

    <div class="panel-box">
        <h3>Option B: Manual Paste</h3>
        <textarea id="rawTextInput" placeholder="Paste custom translations here..."></textarea>
        <button class="std-btn" style="background: var(--oxford-navy-dark); color: white; border: 1px solid rgba(255,255,255,0.2);" onclick="renderManualText()">Render Text</button>
    </div>
</div>

<div id="workspace">
    <div id="text-canvas">
        <span style="color: #aaa; font-style: italic; font-size: 18px; pointer-events: none;">Load the BSB Database on the left, then fetch a verse!</span>
    </div>
</div>

<div id="lexicon-panel">
    <div class="lexicon-header">
        <h2>Lexicon Database</h2>
        <div class="strongs-search-container">
            <input type="text" id="strongsInput" class="strongs-input" placeholder="Keyword or G-Number" onkeypress="if(event.key === 'Enter') searchStrongs()">
            <button class="strongs-btn" onclick="searchStrongs()">Search</button>
        </div>
    </div>
    <div class="api-content" id="api-results">
        <div class="empty-state">Click a word in the text or enter a search term above...</div>
    </div>
</div>

<script>
    const canvas = document.getElementById('text-canvas');
    const apiResults = document.getElementById('api-results');
    let lastSelected = null;
    let liveBibleDB = {};

    // --- THE HARDCODED BSB INGESTER ---
    function loadBSB(event) {
        const file = event.target.files[0];
        if (!file) return;

        document.getElementById('db-status').innerHTML = `<span class="status-dot" style="background: var(--oxford-gold);"></span>Crunching...`;
        const isTSV = file.name.toLowerCase().endsWith('.tsv') || file.name.toLowerCase().endsWith('.txt');

        const reader = new FileReader();
        reader.onload = function(e) {
            const text = e.target.result;
            const lines = text.split('\n');
            liveBibleDB = {}; 

            let currentRef = "";
            const delimiter = isTSV ? '\t' : ',';

            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                
                const columns = isTSV ? lines[i].split('\t') : lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                
                // Hardcoded based on the developer X-Ray:
                let testament = (columns[1] || "").replace(/"/g, '').trim(); // 'O' or 'N'
                let strongsNum = (columns[10] || "").replace(/"/g, '').trim(); // Raw number
                let verseRef = (columns[12] || "").replace(/"/g, '').trim(); // "Genesis 1:1"
                let engText = (columns[18] || "").replace(/"/g, '').trim(); // "In the beginning"

                // The BSB leaves the reference column blank if it's the same verse as the line above it
                if (verseRef) {
                    currentRef = verseRef;
                } else {
                    verseRef = currentRef;
                }

                if (!verseRef || !engText) continue;

                // Format the Strong's tag (Add G for New Testament, H for Old Testament)
                let strongsTag = strongsNum;
                if (strongsNum && !isNaN(strongsNum)) {
                    strongsTag = (testament === 'O' ? 'H' : 'G') + strongsNum;
                } else if (strongsNum && !strongsNum.startsWith('G') && !strongsNum.startsWith('H')) {
                    strongsTag = (testament === 'O' ? 'H' : 'G') + strongsNum;
                }

                if (!liveBibleDB[verseRef]) liveBibleDB[verseRef] = [];
                liveBibleDB[verseRef].push({ text: engText, strongs: strongsTag });
            }

            document.getElementById('db-status').innerHTML = `<span class="status-dot active"></span>Loaded!`;
            canvas.innerHTML = `<span style="color: #5a9e69; font-size: 16px;">Database perfectly mapped! Try fetching <strong>John 1:1</strong> or <strong>Romans 8:28</strong>.</span>`;
        };
        reader.readAsText(file);
    }

    // --- OPTION A: FETCH VERSE ---
    function fetchVerse() {
        let ref = document.getElementById('verseReference').value.trim();
        if(!ref) return;
        
        // Quick normalization (e.g., changes "john 1:1" to "John 1:1" to match DB)
        const parts = ref.split(' ');
        if(parts.length >= 2) {
            let bName = parts.slice(0, -1).join(' ');
            let bCap = bName.charAt(0).toUpperCase() + bName.slice(1).toLowerCase();
            ref = bCap + " " + parts[parts.length - 1];
        }

        const verseData = liveBibleDB[ref];
        if(!verseData) {
            canvas.innerHTML = `<span style="color: var(--oxford-crimson); font-size: 16px;">Verse "${ref}" not found. (Make sure you capitalize the book name!)</span>`;
            return;
        }

        canvas.innerHTML = `<div style="font-size: 14px; color: var(--oxford-gold); text-transform: uppercase; margin-bottom: 20px; font-weight: bold;">Berean Standard Bible (Tagged)</div>`;
        
        verseData.forEach((item, index) => {
            if(!item.text || item.text === "-") return; 
            
            const span = document.createElement('span');
            
            // Only add the dashed line if the word actually has a Strong's number attached
            if(item.strongs && item.strongs !== "-" && item.strongs !== "G" && item.strongs !== "H") {
                span.className = 'word has-tag';
                span.dataset.strongs = item.strongs;
            } else {
                span.className = 'word';
            }
            
            span.id = `w-${index}`;
            span.innerText = item.text + " ";
            
            span.onclick = () => handleWordClick(span, item.text, span.dataset.strongs);
            canvas.appendChild(span);
        });
    }

    // --- OPTION B: MANUAL PASTE ---
    function renderManualText() {
        const raw = document.getElementById('rawTextInput').value.trim();
        if(!raw) return;
        canvas.innerHTML = '';
        const words = raw.split(/(\s+)/); 
        
        words.forEach((chunk, index) => {
            if (chunk.trim() === '') { 
                canvas.appendChild(document.createTextNode(chunk)); 
            } else {
                const span = document.createElement('span');
                span.className = 'word';
                span.id = `w-${index}`;
                span.innerText = chunk;
                span.onclick = () => handleWordClick(span, chunk, null);
                canvas.appendChild(span);
            }
        });
    }

    // --- THE CLICK HANDLER ---
    function handleWordClick(spanElement, wordText, hiddenTag) {
        if(lastSelected) lastSelected.classList.remove('selected');
        spanElement.classList.add('selected');
        lastSelected = spanElement;

        const cleanWord = wordText.replace(/[.,;!?]/g, '');
        fetchEnglishDefinition(cleanWord);

        if(hiddenTag) {
            let cleanTag = hiddenTag.replace(/[^A-Za-z0-9]/g, '');
            document.getElementById('strongsInput').value = cleanTag;
            searchStrongs(cleanTag); 
        }
    }

    // --- ENGLISH API ---
    async function fetchEnglishDefinition(word) {
        try {
            const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word}`);
            if (!response.ok) return;
            const data = await response.json();
            const wordData = data[0];
            
            let html = `<div style="margin-top: 30px; border-top: 1px solid #ccc; padding-top: 20px;">
                        <h3 class="api-word" style="font-size: 20px;">${wordData.word} <span class="strongs-tag" style="background: #e4e7ea; color: #666;">ENG</span></h3>`;
            wordData.meanings.forEach(meaning => {
                html += `<div class="api-pos">${meaning.partOfSpeech}</div>`;
                meaning.definitions.slice(0, 1).forEach(def => { html += `<div class="api-def" style="font-size: 13px;">${def.definition}</div>`; });
            });
            html += `</div>`;
            apiResults.innerHTML += html; 
        } catch (error) {}
    }

    // --- REVERSE SEARCH & GREEK ENGINE ---
    function searchStrongs(overrideQuery = null) {
        let query = overrideQuery || document.getElementById('strongsInput').value.trim();
        if(!query) return;
        
        apiResults.innerHTML = ''; 
        if (typeof strongsGreekDictionary === 'undefined') {
            apiResults.innerHTML = `<div class="empty-state" style="color: var(--oxford-crimson);">Lexicon script not loaded.</div>`;
            return;
        }

        let upperQuery = query.toUpperCase();
        let strongKey = upperQuery.startsWith('G') || upperQuery.startsWith('H') ? upperQuery : 'G' + upperQuery;
        
        if (strongsGreekDictionary[strongKey] && !isNaN(upperQuery.replace(/G|H/g, ''))) {
            renderGreekCard(strongKey);
            return;
        }

        let results = [];
        let searchWord = query.toLowerCase();
        
        for (const [key, data] of Object.entries(strongsGreekDictionary)) {
            let kjv = (data.kjv_def || "").toLowerCase();
            let def = (data.strongs_def || "").toLowerCase();
            let regex = new RegExp(`\\b${searchWord}\\b`, 'i');
            if (regex.test(kjv) || regex.test(def)) results.push({ key: key, data: data });
        }

        if (results.length === 0) {
            apiResults.innerHTML = `<div class="empty-state">No Greek matches found for "${query}". (Make sure it is a New Testament word!)</div>`;
            return;
        }
        if (results.length === 1) {
            renderGreekCard(results[0].key);
            return;
        }

        let html = `<h3 style="font-size: 12px; color: #666; text-transform: uppercase;">Found ${results.length} matches for "${query}"</h3>`;
        results.forEach(res => {
            html += `
            <div style="background: var(--oxford-cream); border: 1px solid var(--oxford-navy-dark); padding: 12px; margin-bottom: 8px; cursor: pointer;" onclick="searchStrongs('${res.key}')">
                <strong style="font-size: 18px; color: var(--oxford-navy);">${res.data.lemma}</strong> <span class="strongs-tag">${res.key}</span>
                <div style="font-size: 11px; color: #555; margin-top: 5px;">${res.data.kjv_def ? res.data.kjv_def.substring(0, 40) + '...' : ''}</div>
            </div>`;
        });
        apiResults.innerHTML = html;
    }

    function renderGreekCard(key) {
        const data = strongsGreekDictionary[key];
        apiResults.innerHTML = `
            <h3 class="api-word">${data.lemma} <span class="strongs-tag">${key}</span></h3>
            <div class="api-phonetic">${data.translit || ''}</div>
            <div class="api-pos">STRONG'S DEFINITION</div>
            <div class="api-def">${data.strongs_def || "Definition not provided."}</div>
            ${data.kjv_def ? `<div class="api-pos">KJV TRANSLATION(S)</div><div class="api-def" style="border-left: 3px solid var(--oxford-gold);">${data.kjv_def}</div>` : ""}
        `;
    }
</script>
</body>
</html>
